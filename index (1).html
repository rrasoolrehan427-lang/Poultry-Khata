  tab(el){ go(el.dataset.arg === "people" ? "khatas" : el.dataset.arg, {}, {root:true}); },
  pickLang(el){ setLang(el.dataset.arg); go(ONBOARDED() ? "home" : "role", {}, {reset:true, root:ONBOARDED()}); },
  pickRole(el){ if(el.dataset.arg !== "dealer"){ F.role = ""; F.laterNote = true; render(); return; } F.role = "dealer"; F.laterNote = false; render(); },
  roleContinue(){ if(F.role !== "dealer") return; go("details"); },
  setCity(el){ F.city = el.dataset.arg; render(); },
  openKhata(){ F.errName = (F.name||"").trim() ? "" : t("nameRequired"); F.errCity = (F.city||"").trim() ? "" : t("cityRequired"); if(F.errName || F.errCity){ render(); return; } const first = !ONBOARDED(); setOwner({name:F.name, biz:F.biz, city:F.city, area:F.area}); delete FS.onb; if(first) go("startChoice", {}, {root:true}); else { go("settings", {}, {root:false}); toast(t("saved")); } },
  startEmpty(){ go("home", {}, {root:true}); toast(t("saved")); },
  startSample(){ loadSampleData(); for(const k in FS) delete FS[k]; go("home", {}, {root:true}); },
  chip(el){ const name = el.dataset.chips, v = el.dataset.arg;
    const m = name.match(/^row-(party|coll)-(\d+)$/);
    if(m){ const r = F.rows[Number(m[2])]; if(m[1] === "party") r.partyId = v; else r.collector = v; }
    else if(name === "measured") F.measured = v === "1";
    else { if(name === "partyId" && F[name] !== v){ F.invoiceId = undefined; } F[name] = v; }
    render(); },
  setField(el){ F[el.dataset.key] = el.dataset.arg; render(); },
  setFilter(el){ F.filter = el.dataset.arg; render(); },
  setHist(el){ F.hist = el.dataset.arg; render(); },
  setView(el){ F.view = el.dataset.arg; render(); },
  toggleBroker(el){ F.kind = el.checked ? "broker" : "farmer"; },
  savePerson(){ try{ let p; if(F.editId){ p = updateParty(F.editId, {name:F.name, area:F.area, phone:F.phone, aliases:F.aliases, kind:F.kind}); } else { p = addParty({kind:F.kind || "farmer", name:F.name, area:F.area, phone:F.phone, aliases:F.aliases}); } delete FS.addPerson; toast(t("saved")); go("person", {id:p.id}, {reset:true}); }catch(e){ F.err = e.message; render(); } },
  newLoadFor(el){ go("load1", {farmerId:el.dataset.arg}, {reset:true}); },
  setEachUnit(el){ F.eachUnit = el.dataset.arg; render(); },
  setUnit(el){ F.unit = el.dataset.arg; render(); },
  loadNext(){ if(!isSupplier(party(F.farmerId))){ go("people", {tab:"suppliers"}, {reset:true}); return; } F.errWeight = loadGrams() > 0 ? "" : t("weightRequired"); F.errEach = ((F.each||"").trim() && !eachGramsF()) ? t("eachInvalid") : ""; if(F.errWeight || F.errEach){ render(); return; } go("load2"); },
  addRow(){ F.rows.push(newRow(F.rows[F.rows.length - 1])); render(); },
  rowUnit(el){ const [i, u] = el.dataset.arg.split(":"); const r = F.rows[Number(i)]; if(!r) return; r.unit = u === "kg" ? "kg" : "mun"; S.settings.rateUnit = r.unit; saveState(); render(); },
  removeRow(el){ F.rows.splice(Number(el.dataset.arg), 1); render(); },
  loadReview(){ const rows = F.rows || []; F.errRows = ""; if(rows.some(r => rowBad(r))) F.errRows = t("padBad"); else if(rows.some(r => rowPadOver(r))) F.errRows = t("padOver"); else if(!rows.length || rows.some(r => !r.partyId || !(rowGrams(r) > 0) || !(rowRate(r) > 0))) F.errRows = t("shopRequired"); else if(takenGrams() > loadGrams()) F.errRows = t("overAlloc"); else if(takenGrams() + shortGramsF() > loadGrams()) F.errRows = t("overAllocShort"); else if(rows.some(r => rowRecv(r) > rowValue(r))) F.errRows = t("recvOver"); if(F.errRows){ render(); return; } go("loadReview"); },
  loadRecord(){ try{ const dels = (F.rows||[]).map(r => ({partyId:r.partyId, grams:rowGrams(r), grossGrams:rowGross(r), tareGrams:rowTare(r), shortGrams:rowShortG(r), ratePaisa:rowRate(r), rateUnit:rowUnit(r), receiptPaisa:rowRecv(r), collector:r.collector||"dealer", promise:r.promise||""})); const ref = paisaFromText(F.refRate||""); const fid = F.farmerId; const load = postLoad({farmerId:fid, vehicle:F.vehicle, driver:F.driver, vehicleOwner:F.vehicleOwner, grams:loadGrams(), measured:F.measured, refRatePaisa:Number.isNaN(ref)?null:ref, shortGrams:shortGramsF(), each:eachInput(), deliveries:dels}); delete FS.load; go("person", {id:fid}, {root:true}); toast(`${t("recorded")} · <span class="n">${load.id}</span> · <span class="n">${load.time}</span>`); }catch(e){ fail(e.message); } },
  quickAmt(el){ F.amount = fmtPaisa(Number(el.dataset.arg)).replace(/,/g,""); render(); },
  payReview(){ F.errAmt = ""; const amt = payAmount(); const p = party(F.partyId); if(!p){ go("khatas", {}, {root:true}); return; } if(!(amt > 0)){ F.errAmt = t("amountRequired"); render(); return; } if(F.tab === "received"){ if(!F.invoiceId){ F.errAmt = t("noOpenBills"); render(); return; } if(amt > invoiceBalance(F.invoiceId)){ F.errAmt = t("recvOver"); render(); return; } if(F.collector === "driver" && F.method !== "cash"){ F.errAmt = t("driverCashOnly"); render(); return; } } if(F.tab === "paid" && amt > supplierPayable(p.id)){ F.errAmt = t("amountOverPayable"); render(); return; } go("payReview"); },
  payRecord(){ try{ const amt = payAmount(); const pid = F.partyId; if(F.tab === "received"){ postReceipt({partyId:pid, invoiceId:F.invoiceId || null, amountPaisa:amt, method:F.method, collector:F.collector, promise:F.promise}); } else { postRemittance({partyId:pid, amountPaisa:amt, method:F.method, promise:F.promise}); } delete FS.pay; go("person", {id:pid}, {root:true}); toast(`${t("recorded")} · <span class="n">${nowTime()}</span> · ${t("seeChange")}`); }catch(e){ fail(e.message); } },
  setDay(el){ if(el.dataset.arg === "custom"){ F.customDay = true; F.dayPick = F.day || todayISO(); } else { F.customDay = false; F.day = el.dataset.arg; } render(); },
  applyDay(){ if(validDate(F.dayPick)) F.day = F.dayPick; F.customDay = false; render(); },
  setMonth(el){ F.month = el.dataset.arg; render(); },
  setPer(el){ F.per = el.dataset.arg; render(); },
  editProfile(){ F = FS.onb = FS.onb || {}; F.name = S.owner.name; F.biz = S.owner.biz; F.city = S.owner.city; F.area = S.owner.area; go("details"); },
  handoverRecord(){ try{ const amt = payAmount(); postTransfer({driver:F.driver || S.drivers.find(d => driverCash(d) > 0) || S.drivers[0], amountPaisa:amt}); F.amount = ""; F.err = ""; render(); toast(t("transferDone")); }catch(e){ F.err = e.message; render(); } },
  remEdit(el){ F.editing = el.dataset.arg; F.editingSup = null; const r = S.reminders.find(x => x.id === F.editing); F.newDate = r && r.due ? r.due : todayISO(); render(); },
  remCancel(){ F.editing = null; F.editingSup = null; render(); },
  remSave(el){ try{ reschedule(el.dataset.arg, F.newDate); F.editing = null; render(); toast(t("rescheduled")); }catch(e){ fail(e.message); } },
  supEdit(el){ const pid = el.dataset.arg; const sp = supplierPromise(pid); F.editingSup = pid; F.editing = null; F.newDate = (sp && sp.due) || todayISO(); render(); },
  supSave(el){ try{ setSupplierPromise(el.dataset.arg, F.newDate); F.editingSup = null; render(); toast(t("promiseSaved")); }catch(e){ fail(e.message); } },
  entry(el){ openEntrySheet(el.dataset.arg); },
  doCancelEntry(el){ try{ const reason = (document.getElementById("cancel-reason")||{}).value || ""; cancelEntry(el.dataset.arg, reason); closeSheet(); render(); toast(t("cancelled")); }catch(e){ fail(e.message); } },
  askCancelLoad(el){ const id = el.dataset.arg; openSheet(`<div class="between"><h2>${t("cancelLoad")} · <span class="n">${esc(id)}</span></h2><button class="iconbtn" data-act="closeSheet">${icon("x",22)}</button></div><div class="small">${t("cancelNote")}</div>${field(t("cancelReason"), `<input class="inp" id="cancel-reason" placeholder="">`)}<div class="btn-row"><button class="btn" data-act="closeSheet">${t("cancel")}</button><button class="btn danger" id="btn-cancel-load" data-act="doCancelLoad" data-arg="${esc(id)}">${icon("cancel",20)} ${t("yesCancel")}</button></div>`); },
  doCancelLoad(el){ try{ const reason = (document.getElementById("cancel-reason")||{}).value || ""; cancelLoad(el.dataset.arg, reason); closeSheet(); render(); toast(t("loadCancelled")); }catch(e){ fail(e.message); } },
  setCommUnit(el){ F.unit = el.dataset.arg; render(); },
  saveRate(){ try{ const p = paisaFromText(F.rate||""); if(Number.isNaN(p) || !(p > 0)){ F.err = t("rateRequired"); render(); return; } setCommissionRate(p, F.unit || "mun", F.from || todayISO()); F.err = ""; F.rate = ""; render(); toast(t("rateSaved")); }catch(e){ F.err = e.message; render(); } },
  shareStatement(el){ const txt = statementText(el.dataset.arg, el.dataset.start, el.dataset.end); shareTextOrWhatsApp(txt, t("statement")); },
  copyStatement(el){ copyText(statementText(el.dataset.arg, el.dataset.start, el.dataset.end)).then(ok => toast(ok ? t("copied") : t("copyFail"))); },
  printStatement(){ try{ window.print(); }catch(e){ fail(e.message); } },
  async backupSave(){ flushSave(); const ok = await downloadText(backupFileName(), backupJson()); if(ok === "declined") return; toast(ok ? t("saved") : t("copyFail")); },
  async backupShare(){ flushSave(); const text = backupJson(); try{ const file = new File([text], backupFileName(), {type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:t("backup")}); return; } }catch(e){ if(e && e.name === "AbortError") return; } const ok = await downloadText(backupFileName(), text); if(ok === true) toast(t("saved")); },
  restoreCancel(){ F.restorePending = null; render(); },
  restoreYes(){ if(!F.restorePending) return; restoreBackup(F.restorePending); F.restorePending = null; for(const k in FS) delete FS[k]; setLang(LANG); go("home", {}, {root:true}); toast(t("backupDone")); },
  askErase(){ F.confirmErase = true; render(); },
  cancelErase(){ F.confirmErase = false; render(); },
  doErase(){ eraseAll(); for(const k in FS) delete FS[k]; go("home", {}, {root:true}); toast(t("erased")); },
  installApp(){ const p = window.__installPrompt; if(!p) return; p.prompt(); p.userChoice.then(() => { window.__installPrompt = null; render(); }); },
  voice(el){ openVoice(el.dataset.arg, el.dataset.field, el.dataset.vt); },
  vLang(el){ V.lang = el.dataset.arg; V.result = null; renderVoice(); },
  vMic(){ if(V.listening){ stopListening(); renderVoice(); } else startListening(); },
  vExample(el){ stopListening(); V.heard = el.dataset.arg; V.result = parseSpoken(V.heard, V.type); V.msg = ""; renderVoice(); },
  vRetry(){ stopListening(); V.heard = ""; V.result = null; V.msg = ""; renderVoice(); },
  vType(){ V.typing = !V.typing; V.keypad = false; renderVoice(); const i = document.getElementById("v-typed"); if(i) i.focus(); },
  vParse(){ const i = document.getElementById("v-typed"); V.heard = i ? i.value : ""; V.result = parseSpoken(V.heard, V.type); renderVoice(); },
  vKeypad(){ V.keypad = !V.keypad; V.typing = false; renderVoice(); },
  kp(el){ const k = el.dataset.arg; let cur = String(getModel(V.key) || ""); if(k === "⌫") cur = cur.slice(0,-1); else if(k === ".") { if(!cur.includes(".")) cur += (cur ? "." : "0."); } else cur += k; setModel(V.key, cur); const v = document.getElementById("kp-val"); if(v) v.textContent = cur || "0"; const inp = document.getElementById(V.fieldId); if(inp) inp.value = cur; recalc(); },
  kpDone(){ closeSheet(); render(); },
  vUse(){ applyVoice(); },
};
if(typeof BILL_ACTIONS !== "undefined") Object.assign(ACTIONS, BILL_ACTIONS);

document.getElementById("frame").addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  if(el.tagName === "INPUT" && el.type === "checkbox"){ const fn = ACTIONS[el.dataset.act]; if(fn) fn(el); return; }
  if(el.tagName === "LABEL") return;
  const fn = ACTIONS[el.dataset.act]; if(fn){ ev.preventDefault(); fn(el); }
});
function onModelInput(ev){
  const el = ev.target; if(!el.dataset || !el.dataset.model) return;
  if(ev.type === "change" && String(getModel(el.dataset.model) ?? "") === el.value) return;
  setModel(el.dataset.model, el.value);
  if(el.dataset.model === "partyId") { F.invoiceId = undefined; }
  recalc();
}
document.getElementById("frame").addEventListener("input", onModelInput);
document.getElementById("frame").addEventListener("change", (ev) => {
  const el = ev.target;
  if(el.dataset && el.dataset.actChange === "restoreFile"){
    const f = el.files && el.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => { try{ F.restorePending = parseBackup(String(reader.result)); render(); }catch(e){ fail(e.message); } };
    reader.readAsText(f); el.value = "";
    return;
  }
  onModelInput(ev);
});
document.getElementById("frame").addEventListener("submit", (ev) => ev.preventDefault());

/* ---------- install prompt & service worker (only when served from a real site; harmless elsewhere) ---------- */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__installPrompt = e; if(NAV.cur && NAV.cur.screen === "settings") render(); });
window.addEventListener("appinstalled", () => { window.__installPrompt = null; toast(t("installed")); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
window.addEventListener("pagehide", () => { try{ flushSave(); }catch(e){} });

/* ---------- boot ---------- */
(async function boot(){
  await loadState();
  const f = document.getElementById("frame"); f.dir = LANG === "ur" ? "rtl" : "ltr"; f.lang = LANG; document.documentElement.lang = LANG;
  go(ONBOARDED() ? "home" : "language", {}, {root:true});
  window.__khata = {get S(){ return S; }, totals, partyBalance, periodSummary, parseSpoken, postLoad, postReceipt, postRemittance, postTransfer, cancelEntry, cancelLoad, reschedule, supplierPromise, setSupplierPromise, loadSummary, supplierPayable, eachGramsFrom, tyPrimary, tyCandidates, tySearchForms, makeBillPicture, billText, billRows, billModel, get BILL(){ return BILL; }, lineAmount, invoicePad, setCommissionRate, commissionRateFor, loadSampleData, eraseAll, backupJson, parseBackup, restoreBackup, statementText, flushSave, get F(){ return F; }, go, setLang, get NAV(){ return NAV; }, todayISO};
  window.dispatchEvent(new Event("khata-ready"));
})();
