      actions = `<button class="btn primary" id="btn-add-load-for" data-act="newLoadFor" data-arg="${pp.id}">${icon("truck",22)} ${t("addLoadFor")}</button>
      ${b.payable>0?`<button class="btn soft" id="btn-pay-farmer" data-act="goParams" data-arg="payment" data-params='{"tab":"paid","partyId":"${pp.id}"}'>${icon("cash",22)} ${pp.kind==="broker"?t("paidBrokerBtn"):t("paidFarmerBtn")}</button>`:""}`;
      const loads = S.loads.filter(l => l.farmerId === pp.id).slice().reverse();
      detail = `<h3>${t("loads")}</h3>` + (loads.length ? loads.map(loadCard).join("") : `<div class="empty">${t("noLoads")}</div>`);
    } else {
      balCard = `<div class="card ${b.receivable>0?"tint":"paper"}"><div class="lbl">${t("shopOwesYou")}</div>${money(b.receivable,"xl")}<div class="row" style="margin-top:6px"><span class="tag ${b.receivable>0?"green":""}">${b.receivable>0?t("outstanding"):t("settled")}</span></div>
        <div class="kv" style="margin-top:8px"><span class="k">${t("billAmount")}</span><span class="v n">${fmtPaisa(b.gross)}</span><span class="k">− ${t("receivedLabel")}</span><span class="v n">${fmtPaisa(b.paid)}</span><span class="k strong">= ${t("leftLabel")}</span><span class="v n strong">${fmtPaisa(b.receivable)}</span></div></div>`;
      actions = (b.receivable > 0 ? `<button class="btn primary" id="btn-receive-shop" data-act="goParams" data-arg="payment" data-params='{"tab":"received","partyId":"${pp.id}"}'>${icon("cash",22)} ${t("receivedBtn")}</button>` : "");
      const invs = S.invoices.filter(i => i.partyId === pp.id).slice().reverse();
      detail = `<h3>${t("bills")}</h3>` + (invs.length ? invs.map(i => { const r = S.reminders.find(x => x.invoiceId === i.id); const bal = invoiceBalance(i.id); const st = i.cancelled ? "cancelled" : (r ? reminderStatus(r) : dueStatus("", bal)); const load = loadById(i.loadId); return `<div class="card stack" style="gap:6px;${i.cancelled?"opacity:.6":""}"><div class="between"><div class="strong"><span class="n">${esc(i.ref)}</span>${load&&load.vehicle?` · <span class="n">${esc(load.vehicle)}</span>`:""}</div>${i.cancelled?`<span class="tag red">${t("cancelledTag")}</span>`:stTag(st)}</div>
        ${padTableHtml(i)}
        <div class="kv"><span class="k">${t("date")}</span><span class="v">${prettyDate(i.date)}</span><span class="k">${t("receivedLabel")}</span><span class="v n">PKR ${fmtPaisa(invoiceReceipts(i.id))}</span><span class="k strong">${t("leftLabel")}</span><span class="v n strong">PKR ${fmtPaisa(bal)}</span><span class="k">${t("whenHePays")}</span><span class="v">${r&&r.due?prettyDate(r.due):"—"}</span></div>
        ${bal>0?`<button class="btn sm soft" data-act="goParams" data-arg="payment" data-params='{"tab":"received","partyId":"${pp.id}","invoiceId":"${i.id}"}'>${icon("cash",18)} ${t("receivedBtn")}</button>`:""}</div>`; }).join("") : `<div class="empty">${t("noEntries")}</div>`);

    ${sup ? note(t("farmerIndep")) : note(t("shopOnlyPays"))}
    ${detail}

    ${filt==="custom"?`<div class="row">${field(t("from"), dateInput("h-from","from",addDays(todayISO(),-30)))}${field(t("to"), dateInput("h-to","to",todayISO()))}<button class="btn sm soft" data-act="rerender" style="width:auto">${t("done")}</button></div>`:""}
    <div class="card ledger">${rows || `<div class="empty">${t("noEntries")}</div>`}</div>`;
  }
};
</script>

<script>
/* ---------- load step 1 ---------- */
function loadGrams(){ const w = Number(String(F.weight||"").replace(/,/g,"")); if(!(w > 0)) return 0; const kg = (F.unit || "mun") === "mun" ? w * KG_PER_MUN : w; const g = Math.round(kg * 1000); return Math.abs(kg - g/1000) > 1e-9 ? 0 : g; }
function loadWorking(){ const w = Number(String(F.weight||"").replace(/,/g,"")); if(!(w>0)) return ""; return (F.unit||"mun") === "mun" ? `${w} mun × ${KG_PER_MUN} = ${fmtKg(loadGrams())} kg` : `${fmtKg(loadGrams())} kg = ${munText(loadGrams())} mun`; }
function eachGramsF(){ return eachGramsFrom(F.each || "", F.eachUnit || "gram"); }
function eachInput(){ return (F.each || "").trim() ? {grams:eachGramsF(), unit:F.eachUnit || "gram", text:(F.each || "").trim()} : null; }
function loadTotalCardHtml(){
  const g = loadGrams(); const eg = eachGramsF(); const typed = (F.each || "").trim();
  let eachLine = "";
  if(typed && !eg) eachLine = `<div class="err-msg">${t("eachInvalid")}</div>`;
  else if(eg){ const each = {grams:eg, unit:F.eachUnit || "gram", text:typed}; const birds = g > 0 ? Math.round(g / eg) : 0; eachLine = `<div class="small" style="margin-top:6px">${t("perBird")}: <span class="n">${eachText(each)}</span>${birds?` · ≈ <span class="n">${fmtNum(birds)}</span> ${t("birds")}`:""}</div>`; }
  return `<div class="card tint" id="ld-total-card"><div class="sum-line" style="padding:0"><span>${t("totalWeight")}</span><span class="amount md" id="ld-total">${fmtKg(g)} kg</span></div><div class="working" id="ld-working" style="margin-top:6px">${loadWorking()||"—"}</div>${eachLine}</div>`;
}
function recentValues(key){ const vals = []; S.loads.slice().reverse().forEach(l => { const v = (l[key]||"").trim(); if(v && !vals.includes(v)) vals.push(v); }); return vals.slice(0,4); }
SCREENS.load1 = {
  nav:"people", group:"load", title:()=>t("newLoad"),
  render(p){
    if(p && p.farmerId) F.farmerId = p.farmerId;
    const farmer = party(F.farmerId);
    if(!isSupplier(farmer)) return openKhataFirst("farmer");
    if(!F.unit) F.unit = "mun"; if(!F.eachUnit) F.eachUnit = "gram"; if(F.measured === undefined) F.measured = true;
    const recentV = recentValues("vehicle"), recentD = recentValues("driver");
    const suggest = (vals, key) => vals.length ? `<div class="chips" style="margin-top:6px">${vals.map(v => `<button class="chip tiny ${F[key]===v?"on":""}" data-act="setField" data-key="${key}" data-arg="${esc(v)}"><span class="n">${esc(v)}</span></button>`).join("")}</div>` : "";
    return `
    <div class="eyebrow">${t("loadStep1")}</div>
    <h1>${t("newLoad")}</h1>
    ${personHead(farmer)}
    ${field(t("vehicleNo"), textInput("ld-vehicle","vehicle","LEA-1234",{num:true,inputmode:"text"}) + suggest(recentV, "vehicle"))}
    ${field(t("driver"), textInput("ld-driver","driver","",{ur:true}) + suggest(recentD, "driver"), {right:t("optional")})}
    ${field(t("vehicleOwner"), textInput("ld-owner","vehicleOwner","",{ur:true}), {right:t("optional")})}
    ${autoStampLine()}
    ${field(t("loadedWeight"), numInput("ld-weight","weight","10","weight") + `<div class="row" style="margin-top:8px"><div class="seg" style="flex:1;max-width:220px"><button class="${(F.unit||"mun")==="mun"?"on":""}" data-act="setUnit" data-arg="mun">${t("mun")}</button><button class="${F.unit==="kg"?"on":""}" data-act="setUnit" data-arg="kg">${t("kg")}</button></div><span class="small n">${t("munRule")}</span></div>`, {err:F.errWeight})}
    ${field(t("eachWeight"), numInput("ld-each","each", F.eachUnit==="nag" ? "22" : "2200", "each", {inputmode:"text"}) + `<div class="row" style="margin-top:8px"><div class="seg" style="flex:1;max-width:260px"><button class="${F.eachUnit==="gram"?"on":""}" data-act="setEachUnit" data-arg="gram">${t("gramUnit")}</button><button class="${F.eachUnit==="nag"?"on":""}" data-act="setEachUnit" data-arg="nag">${t("nagUnit")}</button></div></div>`, {hint:t("eachHint"), err:F.errEach, right:t("optional")})}
    ${loadTotalCardHtml()}
    ${chips("measured", [{v:"1",l:t("measured"),icon:"scale"},{v:"0",l:t("estimated")}], F.measured ? "1" : "0")}
    ${field(t("refRate"), numInput("ld-ref","refRate","","rate"), {hint:t("refRateNote"), right:t("optional")})}
    <button class="btn primary" id="ld-next" data-act="loadNext">${t("next")} <span class="flip">${icon("chev",20)}</span></button>`;
  },
  recalc(){ const el = document.getElementById("ld-total-card"); if(el) el.outerHTML = loadTotalCardHtml(); }
};

/* ---------- load step 2: distribute (the Arati's pad: لوڈ، خالی، شارٹ، ریٹ، رقم for every buyer) ---------- */
function newRow(prev){ return {partyId:"", gross:"", tare:"", short:"", rate:"", unit:prev ? prev.unit : "", recv:"", collector:"dealer", promise:""}; }
function rowUnit(r){ return (r.unit || (S.settings && S.settings.rateUnit)) === "kg" ? "kg" : "mun"; }
function rowGross(r){ return kgOrZero(r.gross); }              // NaN = typed, but not a weight
function rowTare(r){ return kgOrZero(r.tare); }
function rowShortG(r){ return kgOrZero(r.short); }
function rowBad(r){ return Number.isNaN(rowGross(r)) || Number.isNaN(rowTare(r)) || Number.isNaN(rowShortG(r)); }
function rowTaken(r){ return rowBad(r) ? 0 : Math.max(0, rowGross(r) - rowTare(r)); }             // birds that left the vehicle for this buyer
function rowGrams(r){ if(rowBad(r)) return 0; const g = rowGross(r) - rowTare(r) - rowShortG(r); return g > 0 ? g : 0; }  // net: what the buyer pays for
function rowRate(r){ const p = paisaFromText(r.rate); return Number.isNaN(p) ? 0 : p; }
function rowValue(r){ const g = rowGrams(r), p = rowRate(r); return (g > 0 && p > 0) ? lineAmount(g, p, rowUnit(r)) : 0; }
function rowRecv(r){ const p = paisaFromText(r.recv || "0"); return Number.isNaN(p) ? 0 : p; }
function rowPadOver(r){ return !rowBad(r) && rowGross(r) > 0 && rowGross(r) - rowTare(r) - rowShortG(r) <= 0; }
function deliveredGrams(){ return sum((F.rows||[]).map(rowGrams)); }
function takenGrams(){ return sum((F.rows||[]).map(rowTaken)); }
function shortGramsF(){ const g = gramsFromKgText(F.shortKg || ""); return g > 0 ? g : 0; }
function remainingGrams(){ return loadGrams() - takenGrams() - shortGramsF(); }
/* the same sums, written out so the dealer can check them */
function netWorking(r){ const g = rowGross(r); if(!(g > 0) || rowBad(r)) return "—"; const e = rowTare(r), sh = rowShortG(r); return `${fmtKg(g)} − ${fmtKg(e)} − ${fmtKg(sh)} = ${fmtKg(rowGrams(r))} kg`; }
function valueWorking(r){ const g = rowGrams(r), p = rowRate(r); if(!(g > 0 && p > 0)) return "—"; return rowUnit(r) === "mun" ? `${fmtKg(g)} kg ÷ ${KG_PER_MUN} = ${munText(g)} mun × ${fmtPaisa(p)} = PKR ${fmtPaisa(rowValue(r))}` : `${fmtKg(g)} kg × ${fmtPaisa(p)} = PKR ${fmtPaisa(rowValue(r))}`; }
function shopChips(name, value){ const shops = searchParties("", ["shop"]); return shops.length ? chips(name, shops.map(p => ({v:p.id, l:partyName(p)})), value) : note(t("noShopsYet"), "amber"); }
function rowCardHtml(r, i){
  const u = rowUnit(r);
  return `
      <div class="card stack" id="row-${i}">
        <div class="between"><h3>${icon("shop",18)} ${t("shopN")} <span class="n">${i+1}</span></h3>${F.rows.length>1?`<button class="iconbtn" data-act="removeRow" data-arg="${i}" aria-label="${t("removeShop")}">${icon("x",20)}</button>`:""}</div>

/* ---------- statement: share as text (WhatsApp) or print / save as PDF ---------- */
function statementData(pid, start, end){
  const pp = party(pid); const sup = isSupplier(pp);
  const sm = periodSummary(start, end, pid);
  let running = sup ? sm.openPay : sm.openRecv;
  const lines = sm.entries.map(e => { if(sup){ if(e.kind==="sale") running += e.amountPaisa; if(e.kind==="commission"||e.kind==="remittance") running -= e.amountPaisa; } else { if(e.kind==="sale") running += e.amountPaisa; if(e.kind==="receipt") running -= e.amountPaisa; } return {e, running:Math.max(0, running)}; });
  return {pp, sup, sm, lines, opening: sup ? sm.openPay : sm.openRecv, closing: sup ? sm.closePay : sm.closeRecv};
}
function statementText(pid, start, end){
  const d = statementData(pid, start, end); const o = S.owner || {};
  const L = [];
  L.push(`${o.biz || o.name || t("appName")}${o.city ? " · " + o.city : ""}`);
  L.push(`${t("stmtFor")}: ${partyName(d.pp)} (${kindName(d.pp.kind)}${partyArea(d.pp) ? " · " + partyArea(d.pp) : ""})`);
  L.push(`${t("period")}: ${start} — ${end}`);
  L.push(`${t("openingBal")}: PKR ${fmtPaisa(d.opening)}`);
  d.lines.forEach(({e, running}) => { const sign = (e.kind==="receipt"||e.kind==="remittance"||e.kind==="commission") ? "−" : "+"; const inv = e.invoiceId ? invoiceById(e.invoiceId) : null; L.push(`${e.date} ${e.time}  ${entryTitle(e).replace(/<[^>]+>/g,"")}${inv?" "+inv.ref:""}  ${sign}PKR ${fmtPaisa(e.amountPaisa)}  = ${fmtPaisa(running)}`); });
  L.push(`${t("closingBal")}: PKR ${fmtPaisa(d.closing)}  (${d.closing > 0 ? (d.sup ? t("youOweFarmer") : t("shopOwesYou")) : t("settled")})`);
  L.push(`${t("stmtAsOf")} ${todayISO()} ${nowTime()} · ${t("stmtThanks")}`);
  return L.join("\n");
}

      <div class="prow total"><span>${t("closingBal")}<br><span class="small">${direction}</span></span><span class="n">PKR ${fmtPaisa(d.closing)}</span></div>
      <div class="small" style="margin-top:8px">${t("stmtThanks")}</div>

    <button class="btn sm no-print" data-act="copyStatement" data-arg="${pp.id}" data-start="${start}" data-end="${end}">${icon("copy",18)} ${t("copyText")}</button>
    <div class="small no-print" style="text-align:center">${t("shareHint")}</div>`;
  }
};
</script>

<script>
/* ---------- reminders ---------- */
SCREENS.reminders = {
  nav:"home", group:"rem", title:()=>t("reminders"),
  render(){
    const filt = F.filter || "all";
    const order = {overdue:0, today:1, upcoming:2, nopromise:3};
    const all = S.reminders.map(r => ({r, st:reminderStatus(r)})).filter(x => x.st !== "paid");
    const list = all.filter(x => filt === "all" || x.st === filt).sort((a,b) => order[a.st] - order[b.st] || (a.r.due||"9").localeCompare(b.r.due||"9"));
    const cards = list.map(({r,st}) => { const p = party(r.partyId); const inv = invoiceById(r.invoiceId); const editing = F.editing === r.id;
      return `<div class="card stack ${st==="overdue"?"red":st==="today"?"amber":""}" id="rem-${r.id}">
        <div class="between"><div><div class="strong">${esc(partyName(p))}</div><div class="small">${esc(partyArea(p))} · <span class="n">${esc(inv.ref)}</span> · ${prettyDate(inv.date)}</div></div>${stTag(st)}</div>
        <div class="between">${money(invoiceBalance(inv.id),"lg")}<div class="small">${t("promiseDate")}<br><span class="strong">${r.due?prettyDate(r.due):"—"}</span></div></div>
        ${r.history.length?`<div class="small">${t("promiseHistory")}: ${r.history.map(h => `<span class="n">${esc(h.from||"—")} → ${esc(h.to)}</span>`).join(", ")}</div>`:""}
        ${editing?`<div class="row">${dateInput("rem-date-"+r.id,"newDate", r.due||todayISO())}<button class="btn sm primary" style="width:auto" data-act="remSave" data-arg="${r.id}">${t("setDate")}</button><button class="btn sm" style="width:auto" data-act="remCancel">${t("cancel")}</button></div>`:""}
        <button class="btn primary sm" data-act="goParams" data-arg="payment" data-params='{"tab":"received","partyId":"${p.id}","invoiceId":"${inv.id}"}'>${icon("cash",20)} ${t("receivedBtn")}</button>
        <div class="btn-row"><button class="btn sm" id="rem-new-${r.id}" data-act="remEdit" data-arg="${r.id}">${icon("calendar",18)} ${t("newDate")}</button><button class="btn sm" data-act="goParams" data-arg="person" data-params='{"id":"${p.id}"}'>${icon("book",18)} ${t("openKhataBtn")}</button>${p.phone?`<a class="btn sm" href="tel:${esc(p.phone)}" style="text-decoration:none">${icon("phone",18)}</a>`:""}</div>
      </div>`; }).join("");
    const sups = S.parties.filter(isSupplier).map(pp => ({pp, sp:supplierPromise(pp.id), payable:supplierPayable(pp.id)})).filter(x => x.payable > 0);
    const supList = sups.map(x => ({...x, st: x.sp && x.sp.due ? supplierPromiseStatus(x.sp) : "nopromise"})).filter(x => filt === "all" || x.st === filt).sort((a,b) => order[a.st] - order[b.st]);
    const supCards = supList.map(({pp, sp, payable, st}) => { const editing = F.editingSup === pp.id;
      return `<div class="card stack ${st==="overdue"?"red":st==="today"?"amber":""}" id="sup-${pp.id}">
        <div class="between"><div><div class="strong">${esc(partyName(pp))}</div><div class="small">${kindName(pp.kind)}${partyArea(pp)?" · "+esc(partyArea(pp)):""}</div></div>${stTag(st)}</div>
        <div class="between">${money(payable,"lg")}<div class="small">${t("whenPayRest")}<br><span class="strong">${sp&&sp.due?prettyDate(sp.due):"—"}</span></div></div>
        ${sp&&sp.history.length?`<div class="small">${t("promiseHistory")}: ${sp.history.map(h => `<span class="n">${esc(h.from||"—")} → ${esc(h.to)}</span>`).join(", ")}</div>`:""}
        ${editing?`<div class="row">${dateInput("sup-date-"+pp.id,"newDate", (sp&&sp.due)||todayISO())}<button class="btn sm primary" style="width:auto" data-act="supSave" data-arg="${pp.id}">${t("setDate")}</button><button class="btn sm" style="width:auto" data-act="remCancel">${t("cancel")}</button></div>`:""}
        <button class="btn primary sm" data-act="goParams" data-arg="payment" data-params='{"tab":"paid","partyId":"${pp.id}"}'>${icon("cash",20)} ${pp.kind==="broker"?t("paidBrokerBtn"):t("paidFarmerBtn")}</button>
        <div class="btn-row"><button class="btn sm" data-act="supEdit" data-arg="${pp.id}">${icon("calendar",18)} ${t("newDate")}</button><button class="btn sm" data-act="goParams" data-arg="person" data-params='{"id":"${pp.id}"}'>${icon("book",18)} ${t("openKhataBtn")}</button></div>
      </div>`; }).join("");
    return `
    <h1>${t("whoNeedsToPay")}</h1>
    ${note(t("inAppOnly"))}
    <div class="chips">${[["all",t("all")],["overdue",t("overdue")],["today",t("dueToday")],["upcoming",t("upcoming")],["nopromise",t("noPromise")]].map(([v,l]) => `<button class="chip ${filt===v?"on":""}" data-act="setFilter" data-arg="${v}">${l}</button>`).join("")}</div>
    <h3>${icon("cash",18)} ${t("theyNeedToPay")}</h3>
    ${cards || `<div class="empty">${icon("check",30)}<div class="strong">${t("allPaid")}</div></div>`}
    <h3>${icon("leaf",18)} ${t("iNeedToPay")}</h3>
    ${supCards || `<div class="empty">${icon("check",30)}<div class="strong">${t("noSupplierDue")}</div></div>`}`;
  }
};

/* ---------- today / any day: the whole day in the order it was written ---------- */
SCREENS.daybook = {
  root:true, nav:"daybook", group:"day", title:()=>t("daybook"),
  render(){
    const today = todayISO(); const day = F.day || today; const filt = F.filter || "all";
    const ents = S.entries.filter(e => e.date === day).sort((a,b) => a.seq - b.seq);
    const P = ents.filter(e => e.status === "posted");
    const k = (kind) => sum(P.filter(e => e.kind === kind).map(e => e.amountPaisa));
    const shown = ents.filter(e => filt === "all" || (filt === "sale" && e.kind === "sale") || (filt === "receipt" && e.kind === "receipt") || (filt === "remittance" && e.kind === "remittance") || (filt === "transfer" && e.kind === "transfer") || (filt === "commission" && (e.kind === "commission" || e.kind === "commission_pending")) || (filt === "other" && (e.kind === "loss" || e.kind === "cancel" || e.status === "cancelled")));
    const loads = S.loads.filter(l => l.date === day);
    return `
    <h1>${t("everyEntry")}</h1>
    <div class="chips">${[[today,t("today")],[addDays(today,-1),t("yesterday")]].map(([v,l]) => `<button class="chip ${day===v?"on":""}" data-act="setDay" data-arg="${v}">${l}</button>`).join("")}<button class="chip ${day!==today&&day!==addDays(today,-1)?"on":""}" data-act="setDay" data-arg="custom">${icon("calendar",16)} ${t("pickDay")}</button></div>
    ${F.customDay?`<div class="row">${dateInput("day-pick","dayPick",day)}<button class="btn sm soft" style="width:auto" data-act="applyDay">${t("done")}</button></div>`:""}
    <div class="strong">${prettyDateYear(day)}</div>
    <div class="card stack"><div class="sum-line"><span>${t("loadsCount")}</span><span class="n strong">${loads.length}</span></div><div class="sum-line"><span>${t("chickenSales")}</span>${money(k("sale"),"md")}</div><div class="sum-line"><span>${t("custReceipts")}</span>${money(k("receipt"),"md")}</div><div class="sum-line"><span>${t("farmerPayments")}</span>${money(k("remittance"),"md")}</div></div>
    <div class="chips">${[["all",t("allEntries")],["sale",t("fSales")],["receipt",t("fReceipts")],["remittance",t("fRemit")],["transfer",t("fTransfers")],["commission",t("fCommission")],["other",t("fOther")]].map(([v,l]) => `<button class="chip tiny ${filt===v?"on":""}" data-act="setFilter" data-arg="${v}">${l}</button>`).join("")}</div>
    <div class="small">${t("oldestFirst")}</div>
    <div class="card ledger">${shown.map(e => entryRow(e)).join("") || `<div class="empty">${t("noEntriesDay")}</div>`}</div>`;
  }
};

/* ---------- month report: summary, shopkeepers, farmers, commission, all entries ---------- */
function monthChoices(){ const cur = todayISO().slice(0,7); return [addMonths(cur,-2), addMonths(cur,-1), cur]; }
function shopsReport(start, end){
  return S.parties.filter(p => p.kind === "shop").map(p => {
    const invs = liveInvoices().filter(i => i.partyId === p.id && i.date >= start && i.date <= end);
    const sold = sum(invs.map(invoiceAmount)); const recvd = sum(posted().filter(e => e.kind === "receipt" && e.partyId === p.id && e.date >= start && e.date <= end).map(e => e.amountPaisa));
    return {p, bills:invs.length, kg:sum(invs.map(i => i.grams)), sold, recvd, left:shopReceivable(p.id)};
  }).filter(x => x.bills || x.recvd || x.left).sort((a,b) => b.left - a.left);
}
function farmersReport(start, end){
  return S.parties.filter(isSupplier).map(p => {
    const loads = S.loads.filter(l => l.farmerId === p.id && !l.cancelled && l.date >= start && l.date <= end);
    const invs = liveInvoices().filter(i => i.farmerId === p.id && i.date >= start && i.date <= end);
    const sold = sum(invs.map(invoiceAmount)); const comm = sum(posted().filter(e => e.kind === "commission" && e.partyId === p.id && e.date >= start && e.date <= end).map(e => e.amountPaisa)); const paid = sum(posted().filter(e => e.kind === "remittance" && e.partyId === p.id && e.date >= start && e.date <= end).map(e => e.amountPaisa));
    return {p, loads:loads.length, grams:sum(loads.map(l => l.grams)), sold, comm, paid, left:supplierPayable(p.id)};
  }).filter(x => x.loads || x.paid || x.left).sort((a,b) => b.left - a.left);
}
function commissionReport(start, end){
  return S.loads.filter(l => !l.cancelled && l.date >= start && l.date <= end).map(l => { const sm = loadSummary(l); const p = party(l.farmerId); return {l, p, sm, farmerLeft:supplierPayable(l.farmerId), shops:sm.invs.map(i => partyName(party(i.partyId))).join("، ")}; }).reverse();
}
SCREENS.month = {
  root:true, nav:"month", group:"month", title:()=>t("month"),
  render(){
    const today = todayISO(); const cur = today.slice(0,7);
    const m = F.month || cur; const custom = F.month === "custom";
    const start = custom && validDate(F.from) ? F.from : m + "-01"; const end = custom && validDate(F.to) ? F.to : monthEnd(m + "-01");
    const view = F.view || "summary";
    const sm = periodSummary(start, end);
    const T = totals();
    let body = "";
    if(view === "summary"){
      body = `
      <div class="card tint stack"><div class="strong">${t("carryForward")}</div><div class="sum-line"><span>${t("openRecv")}</span>${money(sm.openRecv,"sm")}</div><div class="sum-line"><span>${t("openPay")}</span>${money(sm.openPay,"sm")}</div></div>
      <div class="card stack"><div class="sum-line"><span>${t("chickenSales")}</span>${money(sm.sales,"md")}</div><div class="sum-line"><span>${t("custReceipts")}</span>${money(sm.receipts,"md")}</div><div class="sum-line"><span>${t("commission")}</span>${money(sm.commission,"md")}</div><div class="sum-line"><span>${t("farmerPayments")}</span>${money(sm.remittances,"md")}</div>${sm.transfers?`<div class="sum-line"><span>${t("fTransfers")}</span>${money(sm.transfers,"md")}</div>`:""}</div>
      <div class="card dark stack"><div class="sum-line"><span class="lbl" style="margin:0">${t("closeRecv")}</span>${money(sm.closeRecv,"md")}</div><div class="sum-line"><span class="lbl" style="margin:0">${t("closePay")}</span>${money(sm.closePay,"md")}</div></div>
      ${end >= today ? `<div class="card stack"><div class="strong">${t("today")}</div><div class="sum-line"><span>${t("shopsOwe")}</span>${money(T.receivable,"md")}</div><div class="sum-line"><span>${t("farmersDue")}</span>${money(T.payable,"md")}</div><div class="sum-line"><span>${t("cashWithMe")}</span>${money(T.cash,"md")}</div>${T.driverCash?`<div class="sum-line"><span>${t("driverHolds")}</span>${money(T.driverCash,"md")}</div>`:""}${T.bank?`<div class="sum-line"><span>${t("bankBal")}</span>${money(T.bank,"md")}</div>`:""}</div><button class="btn sm soft" data-act="go" data-arg="check">${icon("rules",18)} ${t("check")}</button>` : ""}`;
    } else if(view === "shops"){
      const rep = shopsReport(start, end);
      body = rep.length ? rep.map(x => `<div class="card stack" style="gap:4px"><div class="between"><div class="strong">${esc(partyName(x.p))}</div><button class="btn sm soft" style="width:auto" data-act="goParams" data-arg="person" data-params='{"id":"${x.p.id}"}'>${t("openKhataBtn")}</button></div><div class="kv"><span class="k">${t("bills")}</span><span class="v n">${x.bills} · ${fmtKg(x.kg)} kg</span><span class="k">${t("soldValue")}</span><span class="v n">PKR ${fmtPaisa(x.sold)}</span><span class="k">${t("receivedLabel")}</span><span class="v n">PKR ${fmtPaisa(x.recvd)}</span><span class="k strong">${t("shopOwesYou")}</span><span class="v n strong">PKR ${fmtPaisa(x.left)}</span></div></div>`).join("") + `<div class="card tint"><div class="sum-line" style="padding:0"><span class="strong">${t("monthTotal")} · ${t("soldValue")}</span>${money(sum(rep.map(x=>x.sold)),"md")}</div><div class="sum-line" style="padding:0"><span class="strong">${t("receivedLabel")}</span>${money(sum(rep.map(x=>x.recvd)),"md")}</div></div>` : `<div class="empty">${t("noEntries")}</div>`;
    } else if(view === "farmers"){
      const rep = farmersReport(start, end);
      body = rep.length ? rep.map(x => `<div class="card stack" style="gap:4px"><div class="between"><div class="strong">${esc(partyName(x.p))}</div><button class="btn sm soft" style="width:auto" data-act="goParams" data-arg="person" data-params='{"id":"${x.p.id}"}'>${t("openKhataBtn")}</button></div><div class="kv"><span class="k">${t("loadsCount")}</span><span class="v n">${x.loads} · ${munText(x.grams)} mun</span><span class="k">${t("soldValue")}</span><span class="v n">PKR ${fmtPaisa(x.sold)}</span><span class="k">${t("commission")}</span><span class="v n">PKR ${fmtPaisa(x.comm)}</span><span class="k">${t("paidLabel")}</span><span class="v n">PKR ${fmtPaisa(x.paid)}</span><span class="k strong">${t("farmersDue")}</span><span class="v n strong">PKR ${fmtPaisa(x.left)}</span></div></div>`).join("") + `<div class="card tint"><div class="sum-line" style="padding:0"><span class="strong">${t("monthTotal")} · ${t("soldValue")}</span>${money(sum(rep.map(x=>x.sold)),"md")}</div><div class="sum-line" style="padding:0"><span class="strong">${t("farmerPayments")}</span>${money(sum(rep.map(x=>x.paid)),"md")}</div></div>` : `<div class="empty">${t("noEntries")}</div>`;
    } else if(view === "commission"){
      body = commissionTable(start, end);
    } else {
      body = `<div class="card ledger">${sm.entries.map(e => entryRow(e)).join("") || `<div class="empty">${t("noEntries")}</div>`}</div>`;
    }
    return `
    <h1>${t("monthGlance")}</h1>
    <div class="chips">${monthChoices().map(mm => `<button class="chip ${m===mm?"on":""}" data-act="setMonth" data-arg="${mm}">${monthName(mm+"-01")} <span class="n small">${mm.slice(0,4)}</span></button>`).join("")}<button class="chip ${custom?"on":""}" data-act="setMonth" data-arg="custom">${t("customDates")}</button></div>
    ${custom?`<div class="row">${field(t("from"), dateInput("m-from","from",addDays(today,-30)))}${field(t("to"), dateInput("m-to","to",today))}<button class="btn sm soft" style="width:auto" data-act="rerender">${t("done")}</button></div>`:""}
    <div class="small">${prettyDateYear(start)} → ${prettyDateYear(end)}</div>
    <div class="chips">${[["summary",t("mSummary")],["shops",t("mShops")],["farmers",t("mFarmers")],["commission",t("mCommission")],["entries",t("mEntries")]].map(([v,l]) => `<button class="chip tiny ${view===v?"on":""}" data-act="setView" data-arg="${v}">${l}</button>`).join("")}</div>
    ${body}`;
  }
};
function commissionTable(start, end){
  const rep = commissionReport(start, end);
  if(!rep.length) return `<div class="empty">${t("noCommission")}</div>`;
  const total = sum(rep.map(x => x.sm.commission));
  return rep.map(x => `<div class="card stack" style="gap:4px"><div class="between"><div class="strong">${prettyDate(x.l.date)} · <span class="n">${esc(x.l.id)}</span></div>${x.sm.commissionPending?`<span class="tag amber">${t("commissionNotSet")}</span>`:(x.farmerLeft>0?`<span class="tag amber">${t("farmerUnpaid")}</span>`:`<span class="tag green">${t("farmerPaid")}</span>`)}</div><div class="kv"><span class="k">${t("farmer")} / ${t("broker")}</span><span class="v">${esc(partyName(x.p))}${partyArea(x.p)?` <span class="small">· ${esc(partyArea(x.p))}</span>`:""}</span><span class="k">${t("munSold")}</span><span class="v n">${munText(x.sm.delivered)} mun</span><span class="k">${t("shopkeepers")}</span><span class="v" style="font-weight:400">${esc(x.shops)}</span><span class="k">${t("soldValue")}</span><span class="v n">PKR ${fmtPaisa(x.sm.sold)}</span><span class="k strong">${t("commission")}</span><span class="v n strong">PKR ${fmtPaisa(x.sm.commission)}</span></div></div>`).join("") + `<div class="card dark"><div class="sum-line" style="padding:0"><span class="lbl" style="margin:0">${t("monthTotal")} · ${t("commission")}</span>${money(total,"lg")}</div></div>`;
}

/* ---------- commission: the rate you set, and the record of every load ---------- */
SCREENS.commission = {
  nav:"home", group:"comm", title:()=>t("tCommission"),
  render(){
    const cur = currentCommission(); const hist = (S.settings.commission||[]).slice().reverse();
    if(!F.unit) F.unit = cur ? cur.unit : "mun"; if(F.from === undefined) F.from = todayISO();
    const today = todayISO(); const start = today.slice(0,7) + "-01";
    return `
    <h1>${t("commissionSetting")}</h1>
    <div class="card ${cur?"tint":"amber"}"><div class="lbl">${t("commissionCurrent")}</div><div class="strong" style="font-size:1.3em">${rateText(cur)}</div>${cur?`<div class="small">${t("effectiveFrom")}: ${prettyDate(cur.from)}</div>`:`<div class="small">${t("commissionNone")}</div>`}</div>
    <div class="card stack">
      <div class="strong">${t("setRate")}</div>
      ${field(t("rateAmount"), numInput("cm-rate","rate","100","money"), {err:F.err})}
      <div class="seg" style="max-width:260px"><button class="${F.unit==="mun"?"on":""}" data-act="setCommUnit" data-arg="mun">${t("perMun")}</button><button class="${F.unit==="kg"?"on":""}" data-act="setCommUnit" data-arg="kg">${t("perKg")}</button></div>
      ${field(t("effectiveFrom"), dateInput("cm-from","from",today))}
      <div class="small">${t("rateNote")}</div>
      <button class="btn primary" id="btn-set-rate" data-act="saveRate">${icon("check",22)} ${t("setRate")}</button>
    </div>
    ${hist.length?`<div class="card stack" style="gap:4px"><div class="strong">${t("rateHistory")}</div>${hist.map(c => `<div class="trow"><span>${prettyDate(c.from)} ${n(c.from.slice(0,4))}</span><span class="r n">PKR ${fmtPaisa(c.paisa)} ${c.unit==="kg"?t("perKg"):t("perMun")}</span></div>`).join("")}</div>`:""}
    <h3>${t("commissionRecords")} · ${monthName(today)}</h3>
    ${commissionTable(start, today)}
    <button class="btn sm soft" data-act="goParams" data-arg="month" data-params='{"view":"commission"}'>${icon("chart",18)} ${t("month")}</button>`;
  }
};

/* ---------- check the books ---------- */
SCREENS.check = {
  nav:"month", group:"check", title:()=>t("check"),
  render(){
    const T = totals(); const ok = T.check === T.commission;
    const shopsInCredit = S.parties.filter(p => p.kind === "shop").filter(p => partyBalance(p.id).paid > partyBalance(p.id).gross).length;
    const cancelled = S.entries.filter(e => e.status === "cancelled").length;
    return `
    <h1>${t("addsUp")}</h1><p class="lead">${t("checkLead")}</p>
    <div class="card ${ok?"tint":"red"} stack"><div class="between"><h3>${t("addsUp")}</h3><span class="${ok?"check-ok":"check-bad"}">${ok?icon("check",20):icon("alert",20)} ${ok?t("ok"):t("notOk")}</span></div>
      <div class="kv"><span class="k">${t("cashWithMe")}</span><span class="v n">${fmtPaisa(T.cash)}</span><span class="k">${t("driverHolds")}</span><span class="v n">${fmtPaisa(T.driverCash)}</span><span class="k">${t("bankBal")}</span><span class="v n">${fmtPaisa(T.bank)}</span><span class="k">+ ${t("shopsOwe")}</span><span class="v n">${fmtPaisa(T.receivable)}</span><span class="k">− ${t("farmersDue")}</span><span class="v n">${fmtPaisa(T.payable)}</span><span class="k strong">=</span><span class="v n">${fmtPaisa(T.check)}</span><span class="k">${t("commission")}</span><span class="v n">${fmtPaisa(T.commission)}</span></div>
      <div class="small">${t("addsUpFormula")}</div></div>
    <div class="card stack" style="gap:4px"><div class="trow"><span>${t("entriesCount")}</span><span class="r n">${S.entries.length}</span></div><div class="trow"><span>${t("cancelledTag")}</span><span class="r n">${cancelled}</span></div><div class="trow"><span>${t("loadsCount")}</span><span class="r n">${S.loads.length}</span></div><div class="trow"><span>${t("bills")}</span><span class="r n">${S.invoices.length}</span></div><div class="trow"><span>${t("shopOnlyPays")}</span><span class="r ${shopsInCredit?"check-bad":"check-ok"}">${shopsInCredit?icon("alert",18):icon("check",18)}</span></div></div>`;
  }
};

<script>
/* ---------- bill picture: the Arati's pad (گاڑی، لوڈ، خالی، شارٹ، ریٹ، رقم) as a picture to share ---------- */
const BILL_MAX = 60;
const BILL = {seq:0, blob:null, url:"", name:"", text:"", model:null, err:""};
function plainDate(iso, lang){ if(!validDate(iso)) return String(iso || ""); const d = new Date(iso + "T00:00:00Z"); const ur = lang === "ur"; return `${(ur ? DAYS_UR : DAYS_EN)[d.getUTCDay()]}${ur ? "،" : ","} ${d.getUTCDate()} ${(ur ? MONTHS_UR : MONTHS_EN)[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function shortDate(iso, lang){ if(!validDate(iso)) return String(iso || ""); const d = new Date(iso + "T00:00:00Z"); return `${d.getUTCDate()} ${(lang === "ur" ? MONTHS_UR : MONTHS_EN)[d.getUTCMonth()]}`; }

/* which bills of a shop can be put on the picture */
function billRows(partyId, filter, day){
  let list = billsOf(partyId);
  if(filter === "day") list = list.filter(i => i.date === day);
  else if(filter === "month"){ const ym = todayISO().slice(0, 7); list = list.filter(i => i.date.slice(0, 7) === ym); }
  return list.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.ref < b.ref ? 1 : -1));
}
function billLatestDay(partyId){ const l = billsOf(partyId).map(i => i.date).sort(); return l.length ? l[l.length - 1] : todayISO(); }
function billModel(partyId, invIds, noteText){
  const pp = party(partyId) || {}; const o = S.owner || {}; const b = (S.settings && S.settings.bill) || {};
  const invs = invIds.map(invoiceById).filter(i => i && !i.cancelled && i.partyId === partyId).sort((a, c) => a.date < c.date ? -1 : a.date > c.date ? 1 : (a.ref < c.ref ? -1 : 1));
  const rows = invs.map(inv => Object.assign({inv, date:inv.date}, invoicePad(inv)));
  const dates = [...new Set(rows.map(r => r.date))];
  const tot = {gross:sum(rows.map(r => r.gross)), tare:sum(rows.map(r => r.tare)), short:sum(rows.map(r => r.short)), amount:sum(rows.map(r => r.amount))};
  return {biz:o.biz || o.name || t("appName"), address:b.address || "", contacts:b.contacts || "", tagline:b.tagline || "", buyer:partyName(pp), area:partyArea(pp), rows, dates, tot, note:String(noteText || "").trim(), lang:LANG};
}
function billDateText(m){ return m.dates.length <= 1 ? plainDate(m.dates[0] || todayISO(), m.lang) : `${shortDate(m.dates[0], m.lang)} – ${shortDate(m.dates[m.dates.length - 1], m.lang)}`; }
function billText(m){
  const L = [m.biz]; if(m.address) L.push(m.address); if(m.contacts) L.push(m.contacts);
  L.push(`${t("padBuyer")}: ${m.buyer}${m.area ? " (" + m.area + ")" : ""}`);
  L.push(`${t("padDate")}: ${billDateText(m)}`, "");
  let last = null;
  m.rows.forEach(r => {
    if(m.dates.length > 1 && r.date !== last){ L.push(plainDate(r.date, m.lang)); last = r.date; }
    L.push(`${r.vehicle} · ${t("padLoad")} ${fmtKg(r.gross)} · ${t("padEmpty")} ${fmtKg(r.tare)} · ${t("padShort")} ${fmtKg(r.short)} · ${t("padRate")} ${fmtPaisa(r.ratePaisa)}/${r.unit === "mun" ? t("mun") : t("kg")} · ${t("padAmount")} ${fmtPaisa(r.amount)}`);
  });
  L.push("", `${t("padTotal")}: PKR ${fmtPaisa(m.tot.amount)}`);
  if(m.note) L.push(`${t("padNote")}: ${m.note}`);
  return L.join("\n");
}
async function billFonts(){
  try{
    if(!document.fonts || !document.fonts.load) return;
    await Promise.all([
      document.fonts.load('700 30px "Noto Naskh Arabic"', "ابپتٹثجچحخدڈذرڑزسشصضطظعغفقکگلمنوہھیے٠١٢٣"),
      document.fonts.load('400 30px "Noto Naskh Arabic"', "ابپتٹثجچحخدڈذرڑزسشصضطظعغفقکگلمنوہھیے"),
      document.fonts.load('700 30px "Noto Sans"', "Abc 0123456789 PKR"),
      document.fonts.load('400 30px "Noto Sans"', "Abc 0123456789 PKR")]);
    await document.fonts.ready;
  }catch(e){}
}
function billWrap(ctx, text, maxW){
  const out = [];
  String(text).split(/\r?\n/).forEach(par => {
    const words = par.split(/\s+/).filter(Boolean); let line = "";
    words.forEach(w => { const test = line ? line + " " + w : w; if(!line || ctx.measureText(test).width <= maxW) line = test; else { out.push(line); line = w; } });
    out.push(line);
  });
  return out;
}
/* a roomy first guess of the picture's height; the picture is cut to what was really used, and drawn again if the guess was too small */
function billEstimate(m){
  const nDates = m.dates.length > 1 ? m.dates.length : 0;
  const noteExtra = m.note ? 120 + 48 * (Math.ceil(m.note.length / 16) + m.note.split(/\r?\n/).length) : 0;
  return Math.min(1250 + m.rows.length * 104 + nDates * 62 + noteExtra, 14000);
}
/* draws the bill on a canvas of height H, in the pad's column order; returns the canvas and how far down the drawing really went */
function billPaintCanvas(m, H){
  const ur = m.lang === "ur";
  const W = 1080, M = 40, tw = W - 2 * M;
  const C = {ink:"#153F34", muted:"#5E7069", line:"#7F9B8E", tint:"#E4EFE9", green:"#176B4C", paper:"#FFFFFF"};
  const FAM = ur ? '"Noto Naskh Arabic","Noto Sans","Segoe UI",Roboto,Arial,sans-serif' : '"Noto Sans","Noto Naskh Arabic","Segoe UI",Roboto,Arial,sans-serif';
  const font = (size, bold) => `${bold ? 700 : 400} ${size}px ${FAM}`;
  const nDates = m.dates.length > 1 ? m.dates.length : 0;
  const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, canvas.height);
  ctx.direction = ur ? "rtl" : "ltr"; ctx.textBaseline = "middle";
  const fitText = (text, maxW, size, bold, minSize) => { let s = size; ctx.font = font(s, bold); while(ctx.measureText(text).width > maxW && s > (minSize || 18)){ s -= 2; ctx.font = font(s, bold); } let tx = String(text); if(ctx.measureText(tx).width > maxW){ while(tx.length > 1 && ctx.measureText(tx + "…").width > maxW) tx = tx.slice(0, -1); tx += "…"; } return {text:tx, size:s}; };
  const draw = (text, x, y, size, bold, color, align, maxW) => { const f = fitText(text, maxW || tw, size, bold, 18); ctx.font = font(f.size, bold); ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(f.text, x, y); };
  const startX = ur ? M + tw : M, startAlign = ur ? "right" : "left";
  let y = 0;
  ctx.fillStyle = C.green; ctx.fillRect(0, 0, W, 18); y = 18;
  // header: the dealer's name, address, phone
  y += 56; draw(m.biz, W / 2, y, 62, true, C.ink, "center"); y += 52;
  const lines2 = []; if(m.address){ ctx.font = font(30, false); billWrap(ctx, m.address, tw).forEach(l => lines2.push(l)); } if(m.contacts){ ctx.font = font(30, false); billWrap(ctx, m.contacts, tw).forEach(l => lines2.push(l)); }
  lines2.slice(0, 4).forEach(l => { draw(l, W / 2, y, 30, false, C.muted, "center"); y += 42; });
  if(m.tagline){ draw(m.tagline, W / 2, y, 28, false, C.green, "center"); y += 42; }
  y += 10; ctx.fillStyle = C.line; ctx.fillRect(M, y, tw, 3); y += 34;
  // buyer and date
  const pair = (label, value, yy) => {
    ctx.font = font(30, false); const lw = ctx.measureText(label).width + 16;
    ctx.fillStyle = C.muted; ctx.textAlign = startAlign; ctx.fillText(label, startX, yy);
    const f = fitText(value, tw - lw - 8, 40, true, 24); ctx.font = font(f.size, true); ctx.fillStyle = C.ink; ctx.textAlign = startAlign; ctx.fillText(f.text, ur ? startX - lw : startX + lw, yy);
  };
  pair(t("padBuyer") + ":", m.buyer + (m.area ? " · " + m.area : ""), y + 22); y += 62;
  pair(t("padDate") + ":", billDateText(m), y + 20); y += 62;
  // table
  const widths = [0.215, 0.14, 0.14, 0.125, 0.175, 0.205];
  const cols = widths.map(w => ({w:Math.round(tw * w)})); cols[5].w += tw - cols.reduce((a, c) => a + c.w, 0);
  let x = ur ? M + tw : M;
  cols.forEach(c => { if(ur){ c.r = x; c.l = x - c.w; x = c.l; } else { c.l = x; c.r = x + c.w; x = c.r; } c.c = (c.l + c.r) / 2; });
  const cell = (i, yy, h, fill, stroke) => { const c = cols[i]; if(fill){ ctx.fillStyle = fill; ctx.fillRect(c.l, yy, c.w, h); } ctx.strokeStyle = stroke || C.line; ctx.lineWidth = 2; ctx.strokeRect(c.l, yy, c.w, h); };
  const cellText = (i, text, yy, h, size, bold, color) => { const c = cols[i]; draw(text, c.c, yy + h / 2 + 2, size, bold, color || C.ink, "center", c.w - 14); };
  const heads = [t("padVehicle"), t("padLoad"), t("padEmpty"), t("padShort"), t("padRate"), t("padAmount")];
  const hh = 70; heads.forEach((h, i) => { cell(i, y, hh, C.tint, C.ink); cellText(i, h, y, hh, 32, true, C.ink); }); y += hh;
  let lastDate = null; const RH = 100;
  m.rows.forEach(r => {
    if(nDates && r.date !== lastDate){ lastDate = r.date; ctx.fillStyle = C.tint; ctx.fillRect(M, y, tw, 58); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.strokeRect(M, y, tw, 58); draw(plainDate(r.date, m.lang), W / 2, y + 31, 30, true, C.green, "center"); y += 58; }
    for(let i = 0; i < 6; i++) cell(i, y, RH);
    cellText(0, r.vehicle, y, RH, 32, true);
    cellText(1, fmtKg(r.gross), y, RH, 36, true);
    cellText(2, fmtKg(r.tare), y, RH, 34, false, r.tare > 0 ? C.ink : C.muted);
    cellText(3, fmtKg(r.short), y, RH, 34, false, r.short > 0 ? C.ink : C.muted);
    const rc = cols[4]; draw(fmtPaisa(r.ratePaisa), rc.c, y + 38, 36, true, C.ink, "center", rc.w - 14); draw(r.unit === "mun" ? t("perMun") : t("perKg"), rc.c, y + 76, 24, false, C.muted, "center", rc.w - 14);
    cellText(5, fmtPaisa(r.amount), y, RH, 38, true, C.ink);
    y += RH;
  });
  // total
  const TH = 92;
  for(let i = 0; i < 6; i++) cell(i, y, TH, C.tint, C.ink);
  cellText(0, t("padTotal"), y, TH, 36, true, C.ink);
  cellText(1, fmtKg(m.tot.gross), y, TH, 34, true); cellText(2, fmtKg(m.tot.tare), y, TH, 34, true); cellText(3, fmtKg(m.tot.short), y, TH, 34, true);
  cellText(5, fmtPaisa(m.tot.amount), y, TH, 40, true, C.green);
  y += TH + 30;
  // notes box
  ctx.font = font(32, false);
  const noteLines = m.note ? billWrap(ctx, m.note, tw - 40) : [];
  const nh = Math.max(190, 80 + noteLines.length * 48);
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.strokeRect(M, y, tw, nh);
  draw(t("padNote"), startX + (ur ? -20 : 20), y + 34, 28, false, C.muted, startAlign, 300);
  noteLines.forEach((l, i) => draw(l, startX + (ur ? -20 : 20), y + 84 + i * 48, 32, false, C.ink, startAlign, tw - 40));
  y += nh + 56;
  // signature
  ctx.fillStyle = C.muted; ctx.fillRect(ur ? M + tw - 380 : M, y + 40, 380, 2);
  draw(t("padSign"), ur ? M + tw - 190 : M + 190, y + 72, 28, false, C.muted, "center", 360);
  y += 120;
  return {canvas, y, W, C};
}
/* the finished picture: {blob, dataUrl, name, width, height} */
async function makeBillPicture(m){
  await billFonts();
  let H = billEstimate(m);
  let r = billPaintCanvas(m, H);
  if(r.y > H && H < 14000) r = billPaintCanvas(m, Math.min(r.y + 40, 14000));
  const {canvas, W, C} = r;
  const out = document.createElement("canvas"); out.width = W; out.height = Math.min(r.y, canvas.height);
  const octx = out.getContext("2d"); octx.fillStyle = C.paper; octx.fillRect(0, 0, W, out.height); octx.drawImage(canvas, 0, 0);
  octx.strokeStyle = C.green; octx.lineWidth = 6; octx.strokeRect(3, 3, W - 6, out.height - 6);
  const blob = await new Promise(res => out.toBlob(res, "image/png"));
  const stamp = todayISO() + "-" + nowTime().replace(":", "");
  return {blob, dataUrl:out.toDataURL("image/png"), name:`bill-${stamp}.png`, width:W, height:out.height};
}

/* ---------- screens ---------- */
function billSelIds(){ return Object.keys(F.sel || {}).filter(k => F.sel[k]); }
function billVisible(){ return F.partyId ? billRows(F.partyId, F.filter || "day", F.day || billLatestDay(F.partyId)) : []; }
function billSelectAll(){ F.sel = {}; billVisible().forEach(i => { F.sel[i.id] = true; }); }
function billPickHtml(i){
  const on = !!(F.sel && F.sel[i.id]); const pd = invoicePad(i); const withDate = (F.filter || "day") !== "day";
  return `<button class="pick ${on ? "on" : ""}" id="pick-${i.id}" data-act="billToggle" data-arg="${i.id}" aria-pressed="${on}"><span class="box">${icon("check", 18)}</span><span class="mid"><span class="t1">${withDate ? prettyDate(i.date) + " · " : ""}<span class="n">${esc(pd.vehicle)}</span></span><span class="t2 n">${fmtKg(i.grams)} kg × ${invRateText(i)}</span></span><span class="end">${money(pd.amount, "sm")}</span></button>`;
}
function billPaint(){
  const list = billVisible(); const cnt = list.filter(i => F.sel && F.sel[i.id]).length;
  const l = document.getElementById("bill-list"); if(l) l.innerHTML = list.length ? list.map(billPickHtml).join("") : `<div class="empty">${t("billNoBills")}</div>`;
  const c = document.getElementById("bill-count"); if(c) c.innerHTML = `<span class="n strong">${cnt}</span> ${t("billSelected")}`;
  const b = document.getElementById("bill-make"); if(b) b.disabled = cnt === 0;
}
SCREENS.billPic = {
  nav:"people", group:"bill", title:()=>t("billPicTitle"),
  render(p){
    if(!F.init){ F.init = true; F.partyId = (p && p.partyId) || ""; F.fixed = !!F.partyId; F.filter = "day"; F.day = F.partyId ? billLatestDay(F.partyId) : ""; if(F.partyId) billSelectAll(); }
    const shops = searchParties("", ["shop"]);
    if(!shops.length) return `<h1>${t("billPicTitle")}</h1>${note(t("noShopsYet"), "amber")}<button class="btn" data-act="back">${t("back")}</button>`;
    if(!F.partyId || !party(F.partyId)){
      return `<h1>${t("billPicTitle")}</h1><p class="lead">${t("billPickShop")}</p><div class="list" id="bill-shops">${shops.map(pp => `<button class="item" id="bill-shop-${pp.id}" data-act="billShop" data-arg="${pp.id}"><div class="ic">${icon("shop", 22)}</div><div class="mid"><div class="t1">${esc(partyName(pp))}</div><div class="t2">${esc(partyArea(pp))}</div></div><span class="flip">${icon("chev", 18)}</span></button>`).join("")}</div>`;
    }
    const pp = party(F.partyId); const day = F.day || billLatestDay(pp.id); const filt = F.filter || "day";
    const b = (S.settings && S.settings.bill) || {};
    const headerEmpty = !(b.address || b.contacts || b.tagline);
    return `
    ${personHead(pp)}
    ${F.fixed ? "" : `<button class="btn sm" data-act="billChangeShop" style="width:auto;align-self:flex-start">${icon("swap", 18)} ${t("changeShop")}</button>`}
    ${headerEmpty ? `<div class="note">${icon("info", 18)}<span class="grow">${t("billHeaderEmpty")}</span><button class="btn sm soft" style="width:auto;min-height:40px" data-act="go" data-arg="billHeader">${t("billHeaderTitle")}</button></div>` : ""}
    <h3>${t("billWhich")}</h3>
    <div class="chips">${[["day", prettyDate(day)], ["month", t("thisMonth")], ["all", t("all")]].map(([v, l]) => `<button class="chip ${filt === v ? "on" : ""}" data-act="billFilter" data-arg="${v}">${l}</button>`).join("")}</div>
    <div class="between"><span class="small" id="bill-count"></span><span class="row" style="gap:8px"><button class="btn sm soft" id="bill-all" data-act="billAll" style="width:auto;min-height:40px">${t("selectAll")}</button><button class="btn sm" id="bill-none" data-act="billNone" style="width:auto;min-height:40px">${t("clearAll")}</button></span></div>
    <div class="stack" id="bill-list" style="gap:8px"></div>
    ${field(t("billNoteLabel"), textInput("bill-note", "note", "", {ur:true}), {right:t("optional")})}
    ${F.errBill ? `<div class="err-msg">${F.errBill}</div>` : ""}

/* ---------- spoken number parser ---------- */
const UR_NUMS = {"صفر":0,"ایک":1,"دو":2,"تین":3,"چار":4,"پانچ":5,"چھ":6,"چھے":6,"سات":7,"آٹھ":8,"نو":9,"دس":10,"گیارہ":11,"بارہ":12,"تیرہ":13,"چودہ":14,"پندرہ":15,"سولہ":16,"سترہ":17,"اٹھارہ":18,"انیس":19,"بیس":20,"اکیس":21,"بائیس":22,"تئیس":23,"چوبیس":24,"پچیس":25,"چھبیس":26,"ستائیس":27,"اٹھائیس":28,"انتیس":29,"تیس":30,"اکتیس":31,"بتیس":32,"تینتیس":33,"چونتیس":34,"پینتیس":35,"چھتیس":36,"سینتیس":37,"اڑتیس":38,"انتالیس":39,"چالیس":40,"اکتالیس":41,"بیالیس":42,"تینتالیس":43,"چوالیس":44,"پینتالیس":45,"چھیالیس":46,"سینتالیس":47,"اڑتالیس":48,"انچاس":49,"پچاس":50,"اکیاون":51,"باون":52,"ترپن":53,"چون":54,"پچپن":55,"چھپن":56,"ستاون":57,"اٹھاون":58,"انسٹھ":59,"ساٹھ":60,"اکسٹھ":61,"باسٹھ":62,"تریسٹھ":63,"چونسٹھ":64,"پینسٹھ":65,"چھیاسٹھ":66,"سڑسٹھ":67,"اڑسٹھ":68,"انہتر":69,"ستر":70,"اکہتر":71,"بہتر":72,"تہتر":73,"چوہتر":74,"پچھتر":75,"چھہتر":76,"ستتر":77,"اٹھہتر":78,"اناسی":79,"اسی":80,"اکیاسی":81,"بیاسی":82,"تراسی":83,"چوراسی":84,"پچاسی":85,"چھیاسی":86,"ستاسی":87,"اٹھاسی":88,"نواسی":89,"نوے":90,"اکانوے":91,"بانوے":92,"ترانوے":93,"چورانوے":94,"پچانوے":95,"چھیانوے":96,"ستانوے":97,"اٹھانوے":98,"ننانوے":99,"ڈیڑھ":1.5,"ڈھائی":2.5,"آدھا":0.5,"آدھی":0.5,
 "ਇੱਕ":1,"ਦੋ":2,"ਤਿੰਨ":3,"ਚਾਰ":4,"ਪੰਜ":5,"ਛੇ":6,"ਸੱਤ":7,"ਅੱਠ":8,"ਨੌਂ":9,"ਦਸ":10,"ਵੀਹ":20,"ਪੰਜਾਹ":50,"ਪੰਜ ਸੌ":500};
const EN_NUMS = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,half:0.5,
 ek:1,ik:1,do:2,teen:3,tin:3,char:4,chaar:4,panch:5,paanch:5,panj:5,chhe:6,che:6,saat:7,sat:7,aath:8,ath:8,nau:9,das:10,gyara:11,bara:12,tera:13,chauda:14,pandra:15,sola:16,satra:17,athara:18,unnis:19,bees:20,bis:20,pachees:25,pachis:25,tees:30,tis:30,chalees:40,chalis:40,pachas:50,sath:60,sattar:70,pachattar:75,pachhattar:75,assi:80,nabbe:90,nawway:90,derh:1.5,dedh:1.5,dhai:2.5,dhaai:2.5,adha:0.5,aadha:0.5};
const MULTS = {"سو":100,"ہزار":1000,"لاکھ":100000,"کروڑ":10000000,"ਸੌ":100,"ਹਜ਼ਾਰ":1000,"ਲੱਖ":100000,hundred:100,thousand:1000,lakh:100000,lac:100000,lakhs:100000,million:1000000,crore:10000000,crores:10000000,karor:10000000,sau:100,so:100,hazar:1000,hazaar:1000,hazara:1000};
const FRACS = {"ساڑھے":0.5,"سوا":0.25,"پونے":-0.25,sadhe:0.5,saadhe:0.5,sawa:0.25,sava:0.25,paune:-0.25,pone:-0.25};
const UNITS = {"کلو":"kg","کلوگرام":"kg","کلوز":"kg",kilo:"kg",kilos:"kg",kg:"kg",kgs:"kg",kilogram:"kg",kilograms:"kg","ਕਿਲੋ":"kg","من":"mun",mun:"mun",maund:"mun",maunds:"mun",man:"mun","ਮਣ":"mun","روپے":"pkr","روپیہ":"pkr","روپیے":"pkr","روپئے":"pkr",rupees:"pkr",rupee:"pkr",rupay:"pkr",rupaye:"pkr",rs:"pkr",pkr:"pkr","ਰੁਪਏ":"pkr","گرام":"gram",gram:"gram",grams:"gram",g:"gram","پیسے":"paisa","پیسہ":"paisa",paisa:"paisa",paise:"paisa","مرغیاں":"birds","مرغی":"birds","مرغے":"birds",birds:"birds",bird:"birds",murghi:"birds",murgi:"birds",murghiyan:"birds",nag:"birds","نگ":"birds",chickens:"birds",chicken:"birds"};
const IGNORE = new Set(["جی","ہاں","وزن","ریٹ","رقم","ہے","ہیں","کا","کی","کے","تقریباً","لکھو","لکھیں","لکھ دو","please","the","is","are","it","about","hai","hain","ji","haan","write","put","enter","total","amount","weight","rate","of","and","اور","ਜੀ","سے","تا","to","-","–","—","each","per","ہر","فی"]);
const NEG = new Set(["منفی","minus","negative","مائنس"]);
function normalizeSpoken(s){ return String(s||"").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[،,]/g," ").replace(/[ً-ْٰ‌‏]/g,"").replace(/[.!?؟]+$/,"").replace(/(\d)([^\d\s.])/g,"$1 $2").replace(/([^\d\s.])(\d)/g,"$1 $2").toLowerCase().trim(); }
function parseSpoken(text, fieldType){
  let raw = normalizeSpoken(text);
  if(fieldType === "each") raw = raw.replace(/(ہر|فی)\s*(مرغی|مرغا|مرغے|چوزہ|چوزے)/g, " ").replace(/\b(per|each)\s+(bird|chicken|murghi|murgi)\b/g, " ").replace(/\s+/g, " ").trim();
  if(!raw) return {ok:false, reason:"vUnclear"};
  const words = raw.split(/\s+/).filter(Boolean);
  const toks = [];
  for(const w of words){
    if(NEG.has(w)) return {ok:false, reason:"vNegative"};
    if(w === "لکھ") return {ok:false, reason:"vAmbiguousLakh"};
    if(/^\d+(\.\d+)?$/.test(w)) { toks.push({k:"num", v:Number(w)}); continue; }
    if(UR_NUMS[w] !== undefined) { toks.push({k:"num", v:UR_NUMS[w]}); continue; }
    if(EN_NUMS[w] !== undefined) { toks.push({k:"num", v:EN_NUMS[w]}); continue; }
    if(MULTS[w] !== undefined) { toks.push({k:"mult", v:MULTS[w]}); continue; }
    if(FRACS[w] !== undefined) { toks.push({k:"frac", v:FRACS[w]}); continue; }
    if(UNITS[w]) { toks.push({k:"unit", v:UNITS[w]}); continue; }
    if(IGNORE.has(w)) continue;
    return {ok:false, reason: toks.some(x => x.k === "num" || x.k === "mult") ? "vUnknownUnit" : "vUnclear"};
  }
  // split into groups ending with a unit
  const groups = []; let cur = []; let pendingFrac = 0; let hasFrac = false;
  const flush = (unit) => { if(cur.length){ groups.push({toks:cur, unit}); cur = []; } else if(unit) { return false; } return true; };
  for(const tk of toks){ if(tk.k === "unit"){ if(!flush(tk.v)) return {ok:false, reason:"vUnclear"}; } else cur.push(tk); }
  flush(null);
  if(!groups.length) return {ok:false, reason:"vUnclear"};
  const evalGroup = (g) => {
    let total = 0, acc = 0, lastWasMult = false, lastWasNum = false, frac = 0, any = false, fractional = false, lastMult = 0;
    for(const tk of g.toks){
      if(tk.k === "frac"){ frac = tk.v; fractional = true; continue; }
      if(tk.k === "num"){
        let v = tk.v; if(frac){ v = v + frac; frac = 0; }
        if(!Number.isInteger(v)) fractional = true;
        if(lastWasNum){ if(acc >= 20 && acc % 10 === 0 && v < 10 && Number.isInteger(v)) acc += v; else return {err:"vTwoNumbers"}; }
        else if(lastWasMult){ if(v >= lastMult) return {err:"vTwoNumbers"}; acc += v; }
        else acc += v;
        lastWasNum = true; lastWasMult = false; any = true; continue;
      }
      if(tk.k === "mult"){ if(lastMult && tk.v >= lastMult) return {err:"vTwoNumbers"}; if(acc === 0) acc = 1; acc *= tk.v; lastMult = tk.v; if(tk.v >= 1000){ total += acc; acc = 0; } lastWasMult = true; lastWasNum = false; any = true; continue; }
    }
    if(frac) return {err:"vUnclear"};
    total += acc;
    if(!any || !(total > 0)) return {err:"vUnclear"};
    return {value: total, fractional};
  };
  // weight of each chicken: "22 nag", "22 to 23 nag" (birds per mun), "2200 grams", "2.5 kg"
  if(fieldType === "each"){
    if(groups.length !== 1) return {ok:false, reason:"vTwoNumbers"};
    const g = groups[0]; const u = g.unit;
    if(u === "pkr") return {ok:false, reason:"vRupeesInWeight"};
    if(u === "paisa") return {ok:false, reason:"vPaisa"};
    if(u === "mun") return {ok:false, reason:"vMunInEach"};
    const nums = g.toks.filter(x => x.k === "num"); const others = g.toks.filter(x => x.k !== "num");
    let a, b;
    if(nums.length === 2 && !others.length && Number.isInteger(nums[0].v) && Number.isInteger(nums[1].v) && nums[0].v < 200 && nums[1].v < 200 && nums[1].v >= nums[0].v){ a = nums[0].v; b = nums[1].v; }   // a range such as "22 23 nag"
    else { const r = evalGroup(g); if(r.err) return {ok:false, reason:r.err}; a = b = r.value; }
    const unit = u || (F.eachUnit === "nag" ? "birds" : "gram");
    if(unit === "birds"){ const text = a === b ? String(a) : `${a}-${b}`; const grams = eachGramsFrom(text, "nag"); if(!grams) return {ok:false, reason:"vUnclear"}; return {ok:true, type:"each", unit:"nag", text, grams, working:`${KG_PER_MUN} kg ÷ ${a === b ? a : (a + b) / 2} = ${fmtNum(grams)} g`, assumedUnit:!u ? "nag" : null}; }
    let grams = unit === "kg" ? Math.round(((a + b) / 2) * 1000) : Math.round((a + b) / 2);
    if(!u && grams < 50) grams = grams * 1000;   // "ڈھائی" alone in the grams field means 2.5 kg
    if(grams < 300 || grams > 10000) return {ok:false, reason:"vUnclear"};
    return {ok:true, type:"each", unit:"gram", text:String(grams), grams, working:`${fmtNum(grams)} g = ${fmtNag(nagFromGrams(grams))} ${t("nagUnit")}`, assumedUnit:!u ? "gram" : null};
  }
  const vals = []; for(const g of groups){ const r = evalGroup(g); if(r.err) return {ok:false, reason:r.err}; vals.push({value:r.value, unit:g.unit, fractional:r.fractional}); }
  const units = vals.map(v => v.unit);
  if(units.includes("gram")) return {ok:false, reason:"vGrams"};
  if(units.includes("paisa")) return {ok:false, reason:"vPaisa"};
  if(fieldType === "weight" || fieldType === "weightkg"){
    if(units.includes("pkr")) return {ok:false, reason:"vRupeesInWeight"};
    if(units.includes("birds")) return {ok:false, reason:"vUnknownUnit"};
    let kg = 0, parts = [];
    if(vals.length === 1){ const v = vals[0]; const u = v.unit || (fieldType === "weight" ? (F.unit || "mun") : "kg"); kg = u === "mun" ? v.value * KG_PER_MUN : v.value; parts.push(u === "mun" ? `${v.value} mun × ${KG_PER_MUN} = ${kg} kg` : `${kg} kg`); return {ok:true, type:"weight", kg, working:parts[0], assumedUnit:!v.unit ? u : null}; }
    if(vals.length === 2 && vals[0].unit === "mun" && vals[1].unit === "kg"){ kg = vals[0].value * KG_PER_MUN + vals[1].value; return {ok:true, type:"weight", kg, working:`${vals[0].value} mun × ${KG_PER_MUN} + ${vals[1].value} = ${kg} kg`}; }
    return {ok:false, reason:"vTwoNumbers"};
  }
  if(fieldType === "money" || fieldType === "rate"){
    if(units.includes("kg") || units.includes("mun")) return {ok:false, reason:"vWeightInMoney"};
    if(units.includes("birds")) return {ok:false, reason:"vUnknownUnit"};
    if(vals.length !== 1) return {ok:false, reason:"vTwoNumbers"};
    const v = vals[0]; const paisa = Math.round(v.value * 100); if(Math.abs(v.value * 100 - paisa) > 1e-6) return {ok:false, reason:"vUnclear"};
    return {ok:true, type:"money", paisa, working:`PKR ${fmtPaisa(paisa)}`, assumedUnit:!v.unit ? "pkr" : null};
  }
  if(fieldType === "count"){
    if(units.some(u => u && u !== "birds")) return {ok:false, reason:"vUnitInCount"};
    if(vals.length !== 1) return {ok:false, reason:"vTwoNumbers"};
    if(vals[0].fractional || !Number.isInteger(vals[0].value)) return {ok:false, reason:"vHalfCount"};
    return {ok:true, type:"count", count:vals[0].value, working:`${vals[0].value} ${t("birds")}`};
  }
  return {ok:false, reason:"vUnclear"};
}

/* ---------- voice sheet ---------- */
const V = {key:null, fieldId:null, type:"money", lang:"ur", heard:"", result:null, listening:false, rec:null, msg:""};
const EXAMPLE_PHRASES = {
  weight:{ur:["ڈھائی سو کلو","دس من","دس من بیس کلو","ساڑھے تین سو کلو"], en:["two hundred fifty kg","ten mun","ten mun twenty kg"], pa:["ڈھائی سو کلو","دس من","پنج سو کلو"]},
  weightkg:{ur:["ڈھائی سو کلو","ڈیڑھ سو کلو","پانچ من"], en:["two hundred fifty kg","one hundred fifty","five mun"], pa:["ڈھائی سو کلو","پنج من"]},
  money:{ur:["پچھتر ہزار روپے","پانچ ہزار","ایک لاکھ بیس ہزار","ڈیڑھ لاکھ"], en:["seventy five thousand rupees","five thousand","one lakh twenty thousand"], pa:["پنج ہزار روپے","پچیس ہزار"]},
  rate:{ur:["تین سو روپے","تین سو دس","ساڑھے تین سو"], en:["three hundred rupees","three hundred ten"], pa:["تین سو روپے","تین سو دس"]},
  count:{ur:["دس مرغیاں","بارہ"], en:["ten birds","twelve"], pa:["دس مرغیاں","بارہ"]},
  each:{ur:["بائیس نگ","بائیس تئیس نگ","دو ہزار دو سو گرام","ڈھائی کلو"], en:["twenty two nag","2200 grams","two and a half kg"], pa:["بائیس نگ","ڈھائی کلو"]},
};
function openVoice(key, fieldId, type){ V.key = key; V.fieldId = fieldId; V.type = type; V.lang = LANG === "ur" ? "ur" : "en"; V.heard = ""; V.result = null; V.msg = ""; V.listening = false; V.typing = false; V.keypad = false; renderVoice(); }
function renderVoice(){
  const r = V.result;
  let understood = "";
  if(r && r.ok){ const big = r.type === "weight" ? `${fmtKg(Math.round(r.kg*1000))} kg` : r.type === "money" ? `PKR ${fmtPaisa(r.paisa)}` : r.type === "each" ? (r.unit === "nag" ? `${r.text} ${t("nagUnit")}` : `${fmtNum(r.grams)} ${t("gramUnit")}`) : `${r.count}`; understood = `<div class="card tint stack"><div class="lbl">${t("understood")}</div><div class="big-num">${big}</div><div class="working" style="align-self:center">${esc(r.working)}</div>${r.assumedUnit?`<div class="small" style="text-align:center">${LANG==="ur"?"یونٹ نہیں سنا، خانے کا یونٹ لیا":"No unit heard, field unit assumed"}: <span class="n">${r.assumedUnit==="pkr"?"PKR":r.assumedUnit}</span></div>`:""}<button class="btn primary" data-act="vUse">${icon("check",22)} ${t("useNumber")}</button></div>`; }

  const phrases = (EXAMPLE_PHRASES[V.type] || EXAMPLE_PHRASES.money)[V.lang] || EXAMPLE_PHRASES[V.type].ur;
  const sr = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  openSheet(`
    <div class="between"><h2>${t("voiceTitle")}</h2><button class="iconbtn" data-act="closeSheet" aria-label="${t("cancel")}">${icon("x",22)}</button></div>
    <div class="chips">${[["ur","اردو"],["pa",`${t("punjabi")} <span class="tag amber">${t("experimental")}</span>`],["en","English"]].map(([v,l]) => `<button class="chip ${V.lang===v?"on":""}" data-act="vLang" data-arg="${v}">${l}</button>`).join("")}</div>
    <button class="mic-circle ${V.listening?"listening":""}" data-act="vMic" aria-label="${t("tapToSpeak")}">${icon("mic",40)}</button>
    <div class="small" style="text-align:center">${V.listening?t("listening"):t("tapToSpeak")}</div>
    ${V.msg?`<div class="note amber">${icon("alert",18)}<span>${V.msg}</span></div>`:""}
    <div class="lbl">${t("heard")}</div><div class="heard" dir="auto">${esc(V.heard)||"—"}</div>
    ${understood}
    <div class="btn-row"><button class="btn sm" data-act="vRetry">${t("tryAgain")}</button><button class="btn sm" data-act="vType">${t("typeSpoken")}</button><button class="btn sm" data-act="vKeypad">${t("keypad")}</button></div>
    ${V.typing?`<div class="with-mic"><input class="inp" id="v-typed" dir="auto" placeholder="${t("typeSpoken")}" value="${esc(V.heard)}"><button class="btn sm primary" style="width:auto" data-act="vParse">${t("parse")}</button></div>`:""}
    ${V.keypad?`<div class="stack"><div class="heard n" id="kp-val">${esc(F[V.key]||"")||"0"}</div><div class="keypad">${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k => `<button data-act="kp" data-arg="${k}">${k}</button>`).join("")}</div><button class="btn primary" data-act="kpDone">${t("done")}</button></div>`:""}
    <div class="lbl">${t("examples")}</div>
    <div class="chips">${phrases.map(p => `<button class="chip" data-act="vExample" data-arg="${esc(p)}" dir="auto">${esc(p)}</button>`).join("")}</div>
    <div class="small">${sr ? t("voiceNote") : t("micUnavailable")}</div>`);
}
function stopListening(){ if(V.rec){ try{ V.rec.stop(); }catch(e){} V.rec = null; } V.listening = false; }
function startListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ V.msg = t("micUnavailable"); renderVoice(); return; }
  try{
    const rec = new SR(); rec.lang = V.lang === "ur" ? "ur-PK" : V.lang === "pa" ? "pa-IN" : "en-PK"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (ev) => { const txt = ev.results[0][0].transcript; V.heard = txt; V.result = parseSpoken(txt, V.type); V.listening = false; V.rec = null; renderVoice(); };
    rec.onerror = (ev) => { V.listening = false; V.rec = null; V.msg = (ev.error === "not-allowed" || ev.error === "service-not-allowed") ? t("micBlocked") : t("micUnavailable"); renderVoice(); };
    rec.onend = () => { if(V.listening){ V.listening = false; V.rec = null; renderVoice(); } };
    V.rec = rec; V.listening = true; V.msg = ""; renderVoice(); rec.start();
  }catch(e){ V.listening = false; V.rec = null; V.msg = t("micUnavailable"); renderVoice(); }
}
function applyVoice(){
  const r = V.result; if(!r || !r.ok) return;
  if(r.type === "weight"){
    if(V.type === "weight"){ const g = Math.round(r.kg*1000); if((F.unit||"mun") === "mun" && g % (KG_PER_MUN*1000) === 0) setModel(V.key, String(g/(KG_PER_MUN*1000))); else { F.unit = "kg"; setModel(V.key, fmtKg(g)); } }
    else setModel(V.key, fmtKg(Math.round(r.kg*1000)));
  } else if(r.type === "money") setModel(V.key, fmtPaisa(r.paisa).replace(/,/g,""));
  else if(r.type === "each"){ F.eachUnit = r.unit === "nag" ? "nag" : "gram"; setModel(V.key, r.text); }
  else setModel(V.key, String(r.count));
  closeSheet(); render();
}
function setModel(path, value){ const parts = path.split("."); let o = F; for(let i = 0; i < parts.length - 1; i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = value; }
function getModel(path){ const parts = path.split("."); let o = F; for(const p of parts){ if(o == null) return ""; o = o[p]; } return o ?? ""; }
</script>

<script>
/* ---------- helpers for sharing and files ---------- */
function fail(msg){ toast(`<span style="color:#FFB4A8">${icon("alert",16)}</span> ${esc(msg)}`); }
async function downloadData(name, data, mime){
  // inside the claude.ai viewer, files are handed over through its downloads capability; elsewhere a normal download
  try{ if(window.claude && typeof window.claude.use === "function"){ const dl = await window.claude.use("downloads"); if(dl){ try{ await dl.save({filename:name, data}); return true; }catch(e){ return e && e.code === "declined" ? "declined" : false; } } } }catch(e){}
  try{ const blob = data instanceof Blob ? data : new Blob([data], {type:mime || "application/json"}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); return true; }catch(e){ return false; }
}
function downloadText(name, text, mime){ return downloadData(name, text, mime); }
/* the phone's own share sheet (WhatsApp, Gmail, Drive ... whatever the phone has); a file is saved instead when sharing is not possible */
async function shareFile(blob, name, title, text){
  try{ const file = new File([blob], name, {type:blob.type || "application/octet-stream"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:title || t("appName"), text:text || ""}); return "shared"; } }catch(e){ if(e && e.name === "AbortError") return "cancelled"; }
  const ok = await downloadData(name, blob);
  return ok === true ? "saved" : ok === "declined" ? "cancelled" : "failed";
}
async function shareTextOrWhatsApp(text, title){
  if(navigator.share){ try{ await navigator.share({title: title || t("appName"), text}); return true; }catch(e){ if(e && e.name === "AbortError") return true; } }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
  return true;
}
async function copyText(text){ try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){} try{ const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; } }

/* ---------- actions (every tap goes through here) ---------- */
const ACTIONS = {
  back(){ back(); },
  closeSheet(){ closeSheet(); },
  rerender(){ render(); },
  toggleLang(){ setLang(LANG === "ur" ? "en" : "ur"); },
  setLangBtn(el){ setLang(el.dataset.arg); },
