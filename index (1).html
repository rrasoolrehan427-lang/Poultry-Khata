<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176B4C">
<meta name="description" content="پولٹری کھاتہ — آڑھتی / ڈیلر کا کھاتہ۔ Poultry Khata — the Arati / dealer ledger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="fonts/fonts-local.css">
<title>پولٹری کھاتہ · Poultry Khata</title>
<style>
/* Poultry Khata — dealer (Arati) app. One phone-sized ledger column; frosted chrome top and bottom, notebook cards in between. */
:root{
  --paper:#F7F7F2; --card:#FFFFFF; --ink:#153F34; --muted:#5E7069;
  --green:#176B4C; --green-deep:#115A3F; --on-green:#FFFFFF;
  --tint:#E7F0EB; --tint-2:#D7E6DE; --line:#D9E3DD;
  --amber:#9A6A12; --amber-bg:#FBF1DC; --amber-line:#E6C98A;
  --red:#A93226; --red-bg:#FAE6E3; --red-line:#E9B3AC;
  --outside:#E6EBE7; --shadow:0 10px 40px rgba(21,63,52,.18);
  --glass:rgba(247,247,242,.84);
  --font-ur:'Noto Naskh Arabic','Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',serif;
  --font-en:'Noto Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;
  --font-num:'Noto Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A16; --card:#172620; --ink:#E7F0EB; --muted:#9FB4AA;
    --green:#2F9A6E; --green-deep:#237F5A; --on-green:#F4FBF7;
    --tint:#1B2E26; --tint-2:#24382F; --line:#2C4038;
    --amber:#E6B35A; --amber-bg:#352A10; --amber-line:#6B5320;
    --red:#EE8A7E; --red-bg:#3C201B; --red-line:#7A3A32;
    --outside:#0A110E; --shadow:0 10px 40px rgba(0,0,0,.5);
    --glass:rgba(15,26,22,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A16; --card:#172620; --ink:#E7F0EB; --muted:#9FB4AA;
  --green:#2F9A6E; --green-deep:#237F5A; --on-green:#F4FBF7;
  --tint:#1B2E26; --tint-2:#24382F; --line:#2C4038;
  --amber:#E6B35A; --amber-bg:#352A10; --amber-line:#6B5320;
  --red:#EE8A7E; --red-bg:#3C201B; --red-line:#7A3A32;
  --outside:#0A110E; --shadow:0 10px 40px rgba(0,0,0,.5);
  --glass:rgba(15,26,22,.86);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--font-en);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* phone frame: full screen on phones, a centred phone column on bigger screens */
.frame{position:relative;width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
@media (min-width:560px){
  body{display:flex;align-items:center;justify-content:center;padding:12px}
  .frame{width:420px;height:min(900px,100%);border-radius:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
.frame[dir=rtl]{font-family:var(--font-ur);font-size:20px;line-height:1.75}
.frame[dir=rtl] .en{font-family:var(--font-en);font-size:.85em;line-height:1.4}
.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block;line-height:1.2}
.frame[dir=rtl] .n{font-size:.9em}
.frame[dir=rtl] .flip{transform:scaleX(-1)}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));padding-block:8px 6px}
.hdr-row{display:flex;align-items:center;gap:10px;min-height:44px}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame[dir=rtl] .hdr-title{font-size:1em}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;line-height:1.15}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--font-en)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:active{background:var(--tint)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-family:var(--font-en);color:var(--ink);white-space:nowrap}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banner{display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 10px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:.8em;border:1px solid var(--amber-line)}
.banner button{text-decoration:underline;font-weight:700}

/* screen */
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.screen.no-bar{padding-bottom:40px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--font-en)}
.frame[dir=rtl] .eyebrow{font-family:var(--font-ur);letter-spacing:0;text-transform:none;font-size:15px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px;font-weight:700}
.frame[dir=rtl] h1{font-size:30px;line-height:1.5}
h2{font-size:21px;font-weight:700}
.frame[dir=rtl] h2{font-size:23px;line-height:1.5}
h3{font-size:17px;font-weight:700}
.frame[dir=rtl] h3{font-size:19px}
p{margin:0}
.lead{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.small{font-size:.85em;color:var(--muted)}
.muted{color:var(--muted)}
.strong{font-weight:700}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card.tint{background:var(--tint);border-color:var(--tint-2)}
.card.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.amber{background:var(--amber-bg);border-color:var(--amber-line)}
.card.red{background:var(--red-bg);border-color:var(--red-line)}
.card.paper{background:var(--paper)}
.amount{font-family:var(--font-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:baseline;gap:5px;font-weight:700;line-height:1.1}
.amount .cur{font-size:.55em;font-weight:600;opacity:.8;letter-spacing:.02em}
.amount.xl{font-size:40px}.amount.lg{font-size:30px}.amount.md{font-size:22px}.amount.sm{font-size:18px}
.card.dark .amount .cur{opacity:.75}
.sum-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.sum-line+.sum-line{border-top:1px dashed var(--line)}
.card.dark .sum-line+.sum-line{border-top-color:rgba(255,255,255,.18)}
.lbl{font-size:15px;color:var(--muted);margin-bottom:4px}
.frame[dir=rtl] .lbl{font-size:17px}
.card.dark .lbl{color:rgba(255,255,255,.8)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 18px;border-radius:16px;font-weight:700;font-size:1.02em;border:1.5px solid var(--line);background:var(--card);width:100%;transition:transform .15s,background .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:active{background:var(--green-deep)}
.btn.soft{background:var(--tint);border-color:var(--tint-2)}
.btn.ghost{background:transparent;border-color:transparent;min-height:48px;color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.sm{min-height:48px;font-size:.95em;padding:6px 14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1;min-width:0}
.linkish{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:.95em;transition:background .15s}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.chip.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.chip.red{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.chip.tiny{min-height:30px;padding:0 10px;font-size:13px;font-family:var(--font-en)}
.frame[dir=rtl] .chip.tiny{font-family:var(--font-ur);font-size:14px}

/* inputs */
.field{display:flex;flex-direction:column;gap:5px;position:relative}
.field .lbl{margin:0;display:flex;justify-content:space-between;gap:8px}
.inp{width:100%;min-height:52px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:1.05em;color:var(--ink)}
.inp:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.inp.num{font-family:var(--font-num);direction:ltr;text-align:left;font-variant-numeric:tabular-nums;font-size:1.25em}
.inp.err{border-color:var(--red)}
textarea.inp{min-height:80px;resize:vertical}
/* Urdu typing: strip of other spellings right under the field */
.tybar{position:absolute;inset-inline:0;z-index:40;pointer-events:none;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:8px 10px;background:var(--card);border:1.5px solid var(--green);border-radius:14px;box-shadow:0 8px 24px rgba(21,63,52,.2);scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.tybar::-webkit-scrollbar{display:none}
.tyc{flex:none;pointer-events:auto;min-height:44px;padding:2px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--font-ur);font-size:1.1em;line-height:1.5;white-space:nowrap}
.tyc.main{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.tyc.lat{font-family:var(--font-en);direction:ltr;font-size:.85em;color:var(--muted)}
.tytip{font-size:.82em;line-height:1.5;color:var(--muted);padding:0 4px;white-space:normal}
/* the Arati's pad: گاڑی | لوڈ | خالی | شارٹ | ریٹ | رقم */
.padgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.padgrid .inp{padding:8px 8px;min-height:52px;font-size:1.15em}
.padtable{display:grid;grid-template-columns:1.5fr .85fr .85fr .9fr 1.2fr 1.5fr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.padtable>span{padding:6px 2px;text-align:center;border-inline-start:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;font-size:.84em;line-height:1.25;min-width:0;white-space:nowrap}
.padtable>span:nth-child(6n+1){white-space:normal;overflow-wrap:anywhere}
.padtable>span.h{font-size:.8em}
.padtable>span:nth-child(6n+1){border-inline-start:0}
.padtable>span:nth-child(-n+6){border-top:0}
.padtable>span.h{background:var(--tint);font-weight:700;color:var(--ink)}
.padtable span.u{font-size:.7em;color:var(--muted);font-weight:400}
.padtable>span.t{background:var(--tint);font-weight:700}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:start}
.pick .box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--paper)}
.pick.on{border-color:var(--green);background:var(--tint)}
.pick.on .box{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pick .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .t1{font-weight:700;line-height:1.3}
.pick .t2{font-size:.82em;color:var(--muted)}
.pick .end{flex:none;text-align:end}
.bill-img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:84px;gap:14px;background:var(--green);border-color:var(--green);color:var(--on-green)}
.tile.wide .ic{background:rgba(255,255,255,.18);color:var(--on-green);width:48px;height:48px}
.tile.wide .sub{color:rgba(255,255,255,.85)}
.with-mic{display:flex;gap:8px;align-items:stretch}
.with-mic .inp{flex:1;min-width:0}
.mic{width:56px;min-height:52px;border-radius:14px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.mic:active{background:var(--green-deep)}
.err-msg{color:var(--red);font-size:.9em;font-weight:700}
.hint{font-size:.9em;color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:var(--tint);color:var(--ink);font-size:.92em}
.note.amber{background:var(--amber-bg);color:var(--amber)}
.note.red{background:var(--red-bg);color:var(--red)}
.note svg{flex:none;margin-top:2px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:start}
.item:active{background:var(--tint)}
.item .ic{width:46px;height:46px;border-radius:14px;background:var(--tint);display:grid;place-items:center;color:var(--green);flex:none}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;line-height:1.3}
.item .t2{font-size:.85em;color:var(--muted);line-height:1.4}
.item .end{text-align:end;flex:none}
.item .end .tag{font-size:.78em;color:var(--muted);display:block}
.pos{color:var(--green)}.neg{color:var(--amber)}
.role-row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:start}
.role-row.on{border-color:var(--green);background:var(--tint)}
.role-row.off{opacity:.6}
.role-row .ic{width:48px;height:48px;border-radius:14px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex:none}
.role-row.on .ic{background:var(--green);color:var(--on-green)}
.role-row .t1{font-weight:700}
.role-row .t2{font-size:.85em;color:var(--muted)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.role-row.on .radio{border-color:var(--green);background:var(--green);color:var(--on-green)}
.ledger{display:flex;flex-direction:column}
.lrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start;width:100%;text-align:start}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:36px;height:36px;border-radius:11px;background:var(--tint);display:grid;place-items:center;color:var(--green);flex:none}
.lrow .mid{flex:1;min-width:0}
.lrow .t1{font-weight:700;line-height:1.3}
.lrow .t2{font-size:.82em;color:var(--muted);line-height:1.45}
.lrow .end{text-align:end;flex:none}
.lrow.draft{opacity:.92}
.lrow.cancelled .t1,.lrow.cancelled .end{text-decoration:line-through;opacity:.6}
button.lrow:active{background:var(--tint)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12.5px;font-family:var(--font-en);border:1px solid var(--line);background:var(--card);white-space:nowrap}
.frame[dir=rtl] .tag{font-family:var(--font-ur);font-size:13.5px}
.tag.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.tag.red{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.tag.green{background:var(--tint);border-color:var(--tint-2);color:var(--green)}
.tag.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center;font-weight:700;font-size:1em;line-height:1.3;position:relative}
.tile:active{background:var(--tint)}
.tile .ic{width:52px;height:52px;border-radius:16px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.tile .badge{position:absolute;top:10px;inset-inline-end:10px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-family:var(--font-num);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tile .sub{font-size:.75em;color:var(--muted);font-weight:400}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 14px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}
.divider{height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:end}
.working{font-family:var(--font-num);direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--tint);padding:4px 10px;border-radius:10px;font-size:.95em}
.seg{display:flex;background:var(--tint);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.paper-sheet{background:#fff;color:#153F34;border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.06);font-family:var(--font-en)}
.frame[dir=rtl] .paper-sheet{font-family:var(--font-ur)}
.paper-sheet .pdf-head{border-bottom:2px solid #153F34;padding-bottom:8px;margin-bottom:10px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted #D9E3DD;font-size:.92em}
.prow.total{border-bottom:0;border-top:2px solid #153F34;margin-top:4px;padding-top:8px;font-weight:700}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92em}
.trow:last-child{border-bottom:0}
.trow .r{text-align:end;font-weight:700}

/* bottom bar */
.bar{position:sticky;bottom:0;z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));padding-block:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border-radius:14px;font-size:13px;font-family:var(--font-en);color:var(--muted);padding:6px 2px}
.frame[dir=rtl] .bar button{font-family:var(--font-ur);font-size:14px}
.bar button.on{color:var(--green);background:var(--tint);font-weight:700}

/* sheets, toast */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .dim{position:absolute;inset:0;background:rgba(10,20,16,.45)}
.sheet{position:relative;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:.9em;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:1.4em;font-family:var(--font-num);font-weight:700}
.keypad button:active{background:var(--tint)}
.heard{font-size:1.1em;padding:10px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--line);min-height:52px}
.big-num{font-family:var(--font-num);direction:ltr;unicode-bidi:isolate;font-size:44px;font-weight:700;text-align:center;line-height:1.1}
.mic-circle{width:96px;height:96px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;margin:0 auto;box-shadow:0 8px 24px color-mix(in srgb,var(--green) 40%,transparent)}
.mic-circle.listening{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.check-ok{color:var(--green);font-weight:700}
.check-bad{color:var(--red);font-weight:700}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-en)}

/* printing a statement: only the paper sheet */
@media print{
  body{background:#fff;display:block;padding:0}
  .frame{width:auto;height:auto;border:0;box-shadow:none;border-radius:0;overflow:visible;display:block}
  #hdr,#bar,#sheet,.toast,.no-print{display:none!important}
  .screen{overflow:visible;padding:0;display:block}
  .paper-sheet{box-shadow:none;border:0;padding:0}
}
</style>

<script>
/* ---------- constants & helpers ---------- */
const APP_VERSION = "0.2";
const DATA_VERSION = 1;
const KG_PER_MUN = 40;

let LANG = "ur";
const t = (k) => (STR[LANG][k] !== undefined ? STR[LANG][k] : (STR.en[k] !== undefined ? STR.en[k] : k));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
function roundHalfUp(numerator, denominator){ return Math.floor((numerator + Math.floor(denominator / 2)) / denominator); }
function gramsFromKgText(txt){ const v = Number(String(txt).replace(/,/g,"").trim()); if(!Number.isFinite(v) || v <= 0) return NaN; const g = Math.round(v * 1000); return Math.abs(v - g/1000) > 1e-9 ? NaN : g; }
function paisaFromText(txt){ const s = String(txt ?? "").replace(/,/g,"").trim(); if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN; const [w, f=""] = s.split("."); return Number(w) * 100 + Number((f + "00").slice(0,2)); }
/* a bill line: net grams × rate; the rate is either per kg or per mun (40 kg), whichever the dealer chose for that bill */
function lineAmount(grams, ratePaisa, unit){ return unit === "mun" ? roundHalfUp(grams * ratePaisa, KG_PER_MUN * 1000) : roundHalfUp(grams * ratePaisa, 1000); }
function kgOrZero(txt){ const s = String(txt ?? "").replace(/,/g,"").trim(); if(!s) return 0; if(Number(s) === 0) return 0; const g = gramsFromKgText(s); return Number.isNaN(g) ? NaN : g; }
function commissionAmount(grams, rate){ if(!rate || !(rate.paisa > 0)) return 0; return rate.unit === "kg" ? roundHalfUp(grams * rate.paisa, 1000) : roundHalfUp(grams * rate.paisa, KG_PER_MUN * 1000); }
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fmtPaisa(p){ const neg = p < 0; const a = Math.abs(p); const w = fmtNum(Math.floor(a/100)); const f = a % 100; return (neg?"-":"") + (f ? w + "." + String(f).padStart(2,"0").replace(/0$/,"") : w); }
function money(p, size){ return `<span class="amount ${size||"sm"}"><span class="cur">PKR</span>${fmtPaisa(p)}</span>`; }
function moneyInline(p){ return `<span class="n">PKR ${fmtPaisa(p)}</span>`; }
function fmtKg(g){ const kg = g/1000; return (Number.isInteger(kg) ? String(kg) : kg.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")); }
function munText(g){ const m = g / (KG_PER_MUN*1000); return Number.isInteger(m) ? String(m) : m.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); }
function n(x){ return `<span class="n">${esc(x)}</span>`; }
function validDate(v){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"")) return false; const d = new Date(v+"T00:00:00Z"); return !isNaN(d) && d.toISOString().slice(0,10) === v; }
function addDays(iso, k){ const d = new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+k); return d.toISOString().slice(0,10); }
function monthEnd(iso){ const d = new Date(iso.slice(0,7)+"-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0); return d.toISOString().slice(0,10); }
function addMonths(ym, k){ const d = new Date(ym+"-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth()+k); return d.toISOString().slice(0,7); }
const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_UR = ["جنوری","فروری","مارچ","اپریل","مئی","جون","جولائی","اگست","ستمبر","اکتوبر","نومبر","دسمبر"];
const DAYS_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS_UR = ["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"];
function monthName(iso){ const m = Number(iso.slice(5,7)) - 1; return LANG === "ur" ? MONTHS_UR[m] : MONTHS_EN[m]; }
function prettyDate(iso){ if(!validDate(iso)) return esc(iso||""); const d = new Date(iso+"T00:00:00Z"); const dn = LANG==="ur" ? DAYS_UR[d.getUTCDay()] : DAYS_EN[d.getUTCDay()]; return `${dn}${LANG==="ur"?"،":","} ${n(d.getUTCDate())} ${monthName(iso)}`; }
function prettyDateYear(iso){ return validDate(iso) ? `${prettyDate(iso)} ${n(iso.slice(0,4))}` : esc(iso||""); }
function fmtStamp(date, time){ return `${prettyDate(date)} · <span class="n">${esc(time||"")}</span>`; }
/* real clock, local to the phone */
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function uid(prefix){ uid.c = (uid.c||0) + 1; return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + uid.c; }
/* weight of each chicken: entered as grams per bird, or as "nag per mun" (birds in one mun, e.g. 22 or 22-23) */
function parseRangeText(txt){ const s = String(txt||"").replace(/,/g,"").trim().replace(/\s*(?:-|–|—|to|سے|تا)\s*/i, "-"); const m = s.match(/^(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?))?$/); if(!m) return null; const a = Number(m[1]); const b = m[2] !== undefined ? Number(m[2]) : a; if(!(a > 0) || !(b > 0)) return null; return {a, b, avg:(a + b) / 2}; }
function eachGramsFrom(text, unit){ const r = parseRangeText(text); if(!r) return 0; if(unit === "nag"){ if(r.avg < 4 || r.avg > 120) return 0; return Math.round(KG_PER_MUN * 1000 / r.avg); } let g = r.avg; if(g < 50) g = g * 1000; g = Math.round(g); return (g < 300 || g > 10000) ? 0 : g; }
function nagFromGrams(g){ return g > 0 ? KG_PER_MUN * 1000 / g : 0; }
function fmtNag(x){ return Number.isInteger(x) ? String(x) : x.toFixed(1); }
function eachText(each){ if(!each || !(each.grams > 0)) return ""; const nag = each.unit === "nag" ? String(each.text||"").trim() : fmtNag(nagFromGrams(each.grams)); return `${fmtNum(each.grams)} ${t("gramUnit")} · ${nag} ${t("nagUnit")}`; }
function partyName(p){ return p ? p.name : ""; }
function partyArea(p){ return p ? (p.area || "") : ""; }
function kindName(k){ return {farmer:t("farmer"), broker:t("broker"), shop:t("shop")}[k] || k; }

/* ---------- state ---------- */
let S = null;
function emptyState(){ return {v:DATA_VERSION, owner:null, lang:"ur", parties:[], loads:[], invoices:[], entries:[], reminders:[], supplierPromises:[], seq:0, drivers:[], settings:{commission:[], rateUnit:"mun", bill:{address:"", contacts:"", tagline:""}}, typing:{learned:{}}, sample:false, createdAt:new Date().toISOString(), savedAt:null}; }
function normalizeState(st){
  const base = emptyState();
  const out = Object.assign(base, st || {});
  out.settings = Object.assign({commission:[], rateUnit:"mun"}, out.settings || {});
  out.settings.bill = Object.assign({address:"", contacts:"", tagline:""}, out.settings.bill || {});
  if(out.settings.rateUnit !== "kg") out.settings.rateUnit = "mun";
  out.typing = Object.assign({learned:{}}, out.typing || {});
  if(!out.typing.learned || typeof out.typing.learned !== "object") out.typing.learned = {};
  for(const k of ["parties","loads","invoices","entries","reminders","supplierPromises","drivers"]) if(!Array.isArray(out[k])) out[k] = [];
  if(!Array.isArray(out.settings.commission)) out.settings.commission = [];
  out.v = DATA_VERSION;
  return out;
}
const ONBOARDED = () => !!(S && S.owner);

/* ---------- persistence: IndexedDB with a localStorage fallback ---------- */
const DB_NAME = "poultry-khata", DB_STORE = "state", DB_KEY = "S", LS_KEY = "poultry-khata-state";
function openDb(){ return new Promise((res, rej) => { try{ const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = () => { req.result.createObjectStore(DB_STORE); }; req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }catch(e){ rej(e); } }); }
async function dbGet(){ const db = await openDb(); return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, "readonly"); const r = tx.objectStore(DB_STORE).get(DB_KEY); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function dbPut(val){ const db = await openDb(); return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, "readwrite"); tx.objectStore(DB_STORE).put(val, DB_KEY); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function loadState(){
  let st = null;
  try{ st = await dbGet(); }catch(e){ st = null; }
  if(!st){ try{ const raw = localStorage.getItem(LS_KEY); if(raw) st = JSON.parse(raw); }catch(e){} }
  S = normalizeState(st);
  LANG = S.lang === "en" ? "en" : "ur";
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
let saveTimer = null, SAVE_STATE = "idle";
function saveState(){
  S.savedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const snapshot = JSON.parse(JSON.stringify(S));
    try{ await dbPut(snapshot); SAVE_STATE = "ok"; }catch(e){ SAVE_STATE = "ls"; }
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); }catch(e){ if(SAVE_STATE !== "ok") SAVE_STATE = "fail"; }
  }, 150);
}
function flushSave(){ clearTimeout(saveTimer); const snapshot = JSON.parse(JSON.stringify(S)); try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); }catch(e){} return dbPut(snapshot).catch(() => {}); }

/* ---------- derivations (everything is calculated from the entries list) ---------- */
const party = (id) => S.parties.find(p => p.id === id);
const invoiceById = (id) => S.invoices.find(i => i.id === id);
const loadById = (id) => S.loads.find(l => l.id === id);
const entryById = (id) => S.entries.find(e => e.id === id);
const posted = () => S.entries.filter(e => e.status === "posted");
const liveInvoices = () => S.invoices.filter(i => !i.cancelled);
const isSupplier = (p) => p && (p.kind === "farmer" || p.kind === "broker");
function invoiceAmount(inv){ return lineAmount(inv.grams, inv.ratePaisa, inv.rateUnit); }
/* the pad's columns for one bill row: لوڈ (gross), خالی (empty), شارٹ (short), net, ریٹ and رقم. Older bills only knew the net weight. */
function invoicePad(inv){ const load = loadById(inv.loadId) || {}; const gross = inv.gross > 0 ? inv.gross : inv.grams; return {vehicle:(load.vehicle || "").trim() || inv.loadId, gross, tare:inv.tare > 0 ? inv.tare : 0, short:inv.short > 0 ? inv.short : 0, net:inv.grams, ratePaisa:inv.ratePaisa, unit:inv.rateUnit === "mun" ? "mun" : "kg", amount:invoiceAmount(inv)}; }
function rateUnitText(unit){ return unit === "mun" ? "mun" : "kg"; }
function invRateText(inv){ return `PKR ${fmtPaisa(inv.ratePaisa)}/${rateUnitText(inv.rateUnit)}`; }
function billsOf(partyId, day){ return liveInvoices().filter(i => i.partyId === partyId && (!day || i.date === day)); }
function invoiceReceipts(invId, before){ return sum(posted().filter(e => e.kind === "receipt" && e.invoiceId === invId && (!before || e.date < before)).map(e => e.amountPaisa)); }
function invoiceBalance(invId, before){ const inv = invoiceById(invId); if(!inv || inv.cancelled) return 0; return Math.max(0, invoiceAmount(inv) - invoiceReceipts(invId, before)); }
function shopReceivable(pid, before){ return sum(liveInvoices().filter(i => i.partyId === pid && (!before || i.date < before)).map(i => invoiceBalance(i.id, before))); }
function supplierSales(pid, before){ return sum(liveInvoices().filter(i => i.farmerId === pid && (!before || i.date < before)).map(invoiceAmount)); }
function supplierCommission(pid, before){ return sum(posted().filter(e => e.kind === "commission" && e.partyId === pid && (!before || e.date < before)).map(e => e.amountPaisa)); }
function supplierRemitted(pid, before){ return sum(posted().filter(e => e.kind === "remittance" && e.partyId === pid && (!before || e.date < before)).map(e => e.amountPaisa)); }
function supplierPayable(pid, before){ return Math.max(0, supplierSales(pid, before) - supplierCommission(pid, before) - supplierRemitted(pid, before)); }
function supplierHasPendingCommission(pid){ return S.entries.some(e => e.kind === "commission_pending" && e.status === "info" && e.partyId === pid); }
function partyBalance(pid){
  const p = party(pid);
  if(isSupplier(p)) return {payable:supplierPayable(pid), receivable:0, gross:supplierSales(pid), paid:supplierRemitted(pid), commission:supplierCommission(pid)};
  return {payable:0, receivable:shopReceivable(pid), gross:sum(liveInvoices().filter(i=>i.partyId===pid).map(invoiceAmount)), paid:sum(posted().filter(e=>e.kind==="receipt"&&e.partyId===pid).map(e=>e.amountPaisa))};
}
function driverCash(driver){
  const inn = sum(posted().filter(e => e.kind === "receipt" && e.collector === "driver" && e.method === "cash" && (!driver || e.driver === driver)).map(e => e.amountPaisa));
  const out = sum(posted().filter(e => e.kind === "transfer" && (!driver || e.driver === driver)).map(e => e.amountPaisa));
  return inn - out;
}
function totals(){
  const P = posted();
  const sales = sum(P.filter(e => e.kind === "sale").map(e => e.amountPaisa));
  const receipts = sum(P.filter(e => e.kind === "receipt").map(e => e.amountPaisa));
  const commission = sum(P.filter(e => e.kind === "commission").map(e => e.amountPaisa));
  const remitted = sum(P.filter(e => e.kind === "remittance").map(e => e.amountPaisa));
  const dealerCashIn = sum(P.filter(e => e.kind === "receipt" && e.collector === "dealer" && e.method === "cash").map(e => e.amountPaisa));
  const transfersIn = sum(P.filter(e => e.kind === "transfer").map(e => e.amountPaisa));
  const cashOut = sum(P.filter(e => e.kind === "remittance" && e.method === "cash").map(e => e.amountPaisa));
  const bankIn = sum(P.filter(e => e.kind === "receipt" && e.method === "bank").map(e => e.amountPaisa));
  const bankOut = sum(P.filter(e => e.kind === "remittance" && e.method === "bank").map(e => e.amountPaisa));
  const receivable = sum(liveInvoices().map(i => invoiceBalance(i.id)));
  const payable = sum(S.parties.filter(isSupplier).map(p => supplierPayable(p.id)));
  const cash = dealerCashIn + transfersIn - cashOut;
  const bank = bankIn - bankOut;
  const drv = driverCash();
  return {sales, receipts, commission, remitted, receivable, payable, cash, bank, driverCash:drv, entitlement:Math.max(0, sales - commission), check:cash + drv + bank + receivable - payable};
}
function periodSummary(start, end, pid){
  const after = addDays(end, 1);
  const inRange = (d) => d >= start && d <= end;
  const P = posted().filter(e => inRange(e.date) && (!pid || e.partyId === pid || (e.kind === "sale" && e.invoiceId && invoiceById(e.invoiceId).farmerId === pid)));
  let openRecv = 0, openPay = 0, closeRecv = 0, closePay = 0;
  const recvAt = (before) => sum(liveInvoices().filter(i => i.date < before).map(i => invoiceBalance(i.id, before)));
  if(!pid){ openRecv = recvAt(start); openPay = sum(S.parties.filter(isSupplier).map(p => supplierPayable(p.id, start))); closeRecv = recvAt(after); closePay = sum(S.parties.filter(isSupplier).map(p => supplierPayable(p.id, after))); }
  else if(isSupplier(party(pid))){ openPay = supplierPayable(pid, start); closePay = supplierPayable(pid, after); }
  else { openRecv = shopReceivable(pid, start); closeRecv = shopReceivable(pid, after); }
  const k = (kind) => sum(P.filter(e => e.kind === kind).map(e => e.amountPaisa));
  return {openRecv, openPay, closeRecv, closePay, sales:k("sale"), receipts:k("receipt"), remittances:k("remittance"), commission:k("commission"), transfers:k("transfer"), entries:P.slice().sort((a,b) => a.seq - b.seq)};
}
function dueStatus(due, balance){
  if(balance <= 0) return "paid";
  if(!due) return "nopromise";
  const today = todayISO();
  if(due < today) return "overdue";
  if(due === today) return "today";
  return "upcoming";
}
function reminderStatus(r){ return dueStatus(r.due, invoiceBalance(r.invoiceId)); }
function supplierPromise(pid){ return S.supplierPromises.find(x => x.partyId === pid); }
function supplierPromiseStatus(sp){ return dueStatus(sp.due, supplierPayable(sp.partyId)); }
function loadSummary(load){
  const invs = S.invoices.filter(i => i.loadId === load.id && !i.cancelled);
  const delivered = sum(invs.map(i => i.grams));
  const sold = sum(invs.map(invoiceAmount));
  const received = sum(invs.map(i => invoiceReceipts(i.id)));
  const lossRows = S.entries.filter(e => e.kind === "loss" && e.loadId === load.id && e.status === "info");
  const shortDead = sum(lossRows.filter(e => !(e.meta && e.meta.unsold)).map(e => e.meta.grams));
  const unsold = sum(lossRows.filter(e => e.meta && e.meta.unsold).map(e => e.meta.grams));
  const commission = sum(posted().filter(e => e.kind === "commission" && e.loadId === load.id).map(e => e.amountPaisa));
  const commissionPending = S.entries.some(e => e.kind === "commission_pending" && e.status === "info" && e.loadId === load.id);
  return {invs, delivered, sold, received, left: sold - received, shortDead, unsold, commission, commissionPending, entitlement: sold - commission};
}
function dueCounts(){ const shops = S.reminders.filter(r => { const st = reminderStatus(r); return st === "overdue" || st === "today"; }).length; const sups = S.supplierPromises.filter(sp => { const st = supplierPromiseStatus(sp); return st === "overdue" || st === "today"; }).length; return shops + sups; }
function searchParties(q, kinds){
  const norm = (s) => String(s||"").toLowerCase().replace(/[ً-ْٰ]/g,"").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/ه/g,"ہ").replace(/\s+/g," ").trim();
  const nq = norm(q);
  const words = nq.split(" ").filter(Boolean);
  const variants = words.map(w => [w].concat(/^[a-z']+$/.test(w) && typeof tySearchForms === "function" ? tySearchForms(w).map(norm) : []));
  return S.parties.filter(p => kinds.includes(p.kind)).filter(p => {
    if(!nq) return true;
    const hay = [p.name, p.area, p.phone, ...(p.aliases||[])].map(norm);
    if(hay.some(h => h.includes(nq))) return true;
    return variants.every(vs => hay.some(h => vs.some(v => h.includes(v))));
  }).sort((a, b) => String(a.name).localeCompare(String(b.name)));
}
/* commission rate in force on a date: the latest setting whose start date is on or before it */
function commissionRateFor(date){ const list = (S.settings.commission || []).filter(c => c.from <= date).sort((a, b) => a.from < b.from ? -1 : 1); return list.length ? list[list.length - 1] : null; }
function currentCommission(){ return commissionRateFor(todayISO()); }
function rateText(r){ return r ? `PKR ${fmtPaisa(r.paisa)} ${r.unit === "kg" ? t("perKg") : t("perMun")}` : t("commissionNotSet"); }

/* ---------- posting actions ---------- */
function nextSeq(){ S.seq += 1; return S.seq; }
function mkEntry(o){ return Object.assign({id:uid("e"), status:"posted", collector:"dealer", method:"cash"}, o); }
function push(o){ const e = mkEntry(Object.assign({seq:nextSeq(), date:todayISO(), time:nowTime(), ts:Date.now()}, o)); S.entries.push(e); return e; }
function nextLoadId(){ let k = S.loads.length + 1; while(S.loads.some(l => l.id === "L" + String(k).padStart(3,"0"))) k++; return "L" + String(k).padStart(3,"0"); }

function postLoad(input){
  const farmer = party(input.farmerId);
  if(!isSupplier(farmer)) throw new Error(t("ownerRequired"));
  if(!(input.grams > 0)) throw new Error(t("weightRequired"));
  if(!input.deliveries.length) throw new Error(t("shopRequired"));
  const delivered = sum(input.deliveries.map(d => d.grams));
  const rowShort = sum(input.deliveries.map(d => d.shortGrams > 0 ? d.shortGrams : 0));
  const shortGrams = (input.shortGrams > 0 ? input.shortGrams : 0) + rowShort;
  if(delivered > input.grams) throw new Error(t("overAlloc"));
  if(delivered + shortGrams > input.grams) throw new Error(t("overAllocShort"));
  input.deliveries.forEach(d => { const sp = party(d.partyId); if(!sp || sp.kind !== "shop" || !(d.grams > 0) || !(d.ratePaisa > 0)) throw new Error(t("shopRequired")); if(d.receiptPaisa > lineAmount(d.grams, d.ratePaisa, d.rateUnit)) throw new Error(t("recvOver"));
    // the pad: لوڈ − خالی − شارٹ = the weight the shop pays for
    if(d.grossGrams > 0 && d.grossGrams - (d.tareGrams > 0 ? d.tareGrams : 0) - (d.shortGrams > 0 ? d.shortGrams : 0) !== d.grams) throw new Error(t("padMismatch")); });
  const date = todayISO(), time = nowTime();
  const id = nextLoadId();
  const rate = commissionRateFor(date);
  const each = input.each && input.each.grams > 0 ? {grams:input.each.grams, unit:input.each.unit === "nag" ? "nag" : "gram", text:String(input.each.text || "")} : null;
  const load = {id, farmerId:input.farmerId, driver:(input.driver||"").trim(), vehicle:(input.vehicle||"").trim(), vehicleOwner:(input.vehicleOwner||"").trim(), grams:input.grams, measured:!!input.measured, date, time, ts:Date.now(), rate:rate ? {paisa:rate.paisa, unit:rate.unit} : null, refRatePaisa:input.refRatePaisa || null, each, note:(input.note||"").trim()};
  S.loads.push(load);
  if(load.driver && !S.drivers.includes(load.driver)) S.drivers.push(load.driver);
  input.deliveries.forEach((d, i) => {
    const inv = {id:uid("i"), ref:`${id}-S${i+1}`, loadId:id, partyId:d.partyId, farmerId:input.farmerId, grams:d.grams, ratePaisa:d.ratePaisa, rateUnit:d.rateUnit === "mun" ? "mun" : "kg", date};
    if(d.grossGrams > 0){ inv.gross = d.grossGrams; inv.tare = d.tareGrams > 0 ? d.tareGrams : 0; inv.short = d.shortGrams > 0 ? d.shortGrams : 0; }
    S.invoices.push(inv);
    push({kind:"sale", partyId:d.partyId, invoiceId:inv.id, loadId:id, amountPaisa:invoiceAmount(inv)});
    if(d.receiptPaisa > 0) push({kind:"receipt", partyId:d.partyId, invoiceId:inv.id, loadId:id, amountPaisa:d.receiptPaisa, collector:d.collector || "dealer", method:"cash", driver:d.collector === "driver" ? load.driver : undefined});
    if(invoiceBalance(inv.id) > 0) S.reminders.push({id:uid("r"), invoiceId:inv.id, partyId:d.partyId, due:validDate(d.promise) ? d.promise : "", history:[]});
  });
  if(rate){ push({kind:"commission", partyId:input.farmerId, loadId:id, amountPaisa:commissionAmount(delivered, rate), terms:{paisa:rate.paisa, unit:rate.unit, grams:delivered}}); }
  else { push({kind:"commission_pending", status:"info", partyId:input.farmerId, loadId:id, amountPaisa:0, meta:{grams:delivered}}); }
  if(shortGrams > 0) push({kind:"loss", status:"info", partyId:input.farmerId, loadId:id, amountPaisa:0, meta:{grams:shortGrams, reason:"short_dead"}});
  if(delivered + shortGrams < input.grams) push({kind:"loss", status:"info", partyId:input.farmerId, loadId:id, amountPaisa:0, meta:{grams:input.grams - delivered - shortGrams, unsold:true}});
  const unitUsed = input.deliveries.length ? (input.deliveries[0].rateUnit === "kg" ? "kg" : "mun") : null;
  if(unitUsed) S.settings.rateUnit = unitUsed;
  saveState();
  return load;
}
function setSupplierPromise(pid, due){
  if(!validDate(due)) throw new Error(t("pickDate"));
  let sp = supplierPromise(pid);
  if(!sp){ sp = {id:uid("sp"), partyId:pid, due:"", history:[]}; S.supplierPromises.push(sp); }
  sp.history.push({from:sp.due, to:due, at:todayISO() + " " + nowTime()}); sp.due = due; saveState(); return sp;
}
function postReceipt(input){
  const p = party(input.partyId); if(!p || p.kind !== "shop") throw new Error(t("openKhataFirst"));
  if(!(input.amountPaisa > 0)) throw new Error(t("amountRequired"));
  if(input.collector === "driver" && input.method !== "cash") throw new Error(t("driverCashOnly"));
  // A shopkeeper only ever pays against a bill and never more than the bill (client rule, 7 Nov 2026).
  const inv = input.invoiceId ? invoiceById(input.invoiceId) : null;
  if(!inv || inv.partyId !== p.id || inv.cancelled) throw new Error(t("noOpenBills"));
  const bal = invoiceBalance(inv.id);
  if(input.amountPaisa > bal) throw new Error(t("recvOver"));
  const e = push({kind:"receipt", partyId:p.id, invoiceId:inv.id, loadId:inv.loadId, amountPaisa:input.amountPaisa, collector:input.collector || "dealer", method:input.method || "cash", driver:input.collector === "driver" ? (input.driver || (loadById(inv.loadId)||{}).driver || S.drivers[0] || "") : undefined, note:(input.note||"").trim()});
  const r = S.reminders.find(x => x.invoiceId === inv.id);
  if(r && validDate(input.promise) && invoiceBalance(inv.id) > 0){ r.history.push({from:r.due, to:input.promise, at:todayISO() + " " + nowTime()}); r.due = input.promise; }
  saveState();
  return e;
}
function postRemittance(input){
  const p = party(input.partyId); if(!isSupplier(p)) throw new Error(t("openKhataFirst"));
  if(!(input.amountPaisa > 0)) throw new Error(t("amountRequired"));
  if(input.amountPaisa > supplierPayable(p.id)) throw new Error(t("amountOverPayable"));
  const e = push({kind:"remittance", partyId:p.id, amountPaisa:input.amountPaisa, method:input.method || "cash", note:(input.note||"").trim()});
  if(validDate(input.promise) && supplierPayable(p.id) > 0) setSupplierPromise(p.id, input.promise);
  saveState();
  return e;
}
function postTransfer(input){
  const held = driverCash(input.driver);
  if(held <= 0) throw new Error(t("driverZero"));
  if(!(input.amountPaisa > 0)) throw new Error(t("amountRequired"));
  if(input.amountPaisa > held) throw new Error(t("overDriver"));
  const e = push({kind:"transfer", partyId:"__driver__", driver:input.driver, amountPaisa:input.amountPaisa});
  saveState(); return e;
}
/* corrections: nothing is ever deleted; a cancelled entry stays, struck through, and a cancellation entry records who/when/why */
function canCancel(e){
  if(!e || e.status !== "posted") return {ok:false, why:t("cannotCancel")};
  if(e.kind === "sale"){ if(invoiceReceipts(e.invoiceId) > 0) return {ok:false, why:t("cancelSaleHasReceipts")}; return {ok:true}; }
  if(e.kind === "receipt" || e.kind === "remittance" || e.kind === "transfer" || e.kind === "commission") return {ok:true};
  return {ok:false, why:t("cannotCancel")};
}
function cancelEntry(id, reason){
  const e = entryById(id); const c = canCancel(e); if(!c.ok) throw new Error(c.why);
  // a driver-collected receipt can be cancelled only while the driver still holds that cash (not after it was handed over)
  if(e.kind === "receipt" && e.collector === "driver" && e.method === "cash" && driverCash(e.driver) - e.amountPaisa < 0) throw new Error(t("cannotCancel"));
  e.status = "cancelled"; e.cancelledAt = todayISO() + " " + nowTime();
  if(e.kind === "sale"){ const inv = invoiceById(e.invoiceId); if(inv){ inv.cancelled = true; } S.reminders = S.reminders.filter(r => r.invoiceId !== e.invoiceId); }
  const ce = push({kind:"cancel", status:"info", refId:e.id, partyId:e.partyId, invoiceId:e.invoiceId, loadId:e.loadId, amountPaisa:e.amountPaisa, meta:{kind:e.kind, reason:(reason||"").trim(), seq:e.seq}});
  e.cancelledBy = ce.id;
  saveState();
  return ce;
}
function cancelLoad(loadId, reason){
  const load = loadById(loadId); if(!load || load.cancelled) throw new Error(t("cannotCancel"));
  const sales = posted().filter(e => e.kind === "sale" && e.loadId === loadId);
  if(sales.some(e => invoiceReceipts(e.invoiceId) > 0)) throw new Error(t("cancelSaleHasReceipts"));
  sales.forEach(e => cancelEntry(e.id, reason));
  posted().filter(e => e.kind === "commission" && e.loadId === loadId).forEach(e => cancelEntry(e.id, reason));
  S.entries.filter(e => e.loadId === loadId && e.status === "info" && (e.kind === "loss" || e.kind === "commission_pending")).forEach(e => { e.status = "cancelled"; });
  load.cancelled = true; load.cancelledAt = todayISO() + " " + nowTime();
  saveState();
}
function reschedule(reminderId, newDate){
  const r = S.reminders.find(x => x.id === reminderId); if(!r) return;
  if(!validDate(newDate)) throw new Error(t("pickDate"));
  r.history.push({from:r.due, to:newDate, at:todayISO() + " " + nowTime()}); r.due = newDate; saveState();
}
function addParty(input){
  const name = (input.name||"").trim(); if(!name) throw new Error(t("nameRequired"));
  const kind = input.kind || "shop";
  if(S.parties.some(p => p.kind === kind && p.name.toLowerCase() === name.toLowerCase() && (p.area||"").trim().toLowerCase() === (input.area||"").trim().toLowerCase())) throw new Error(t("duplicateName"));
  const p = {id:uid("p"), name, area:(input.area||"").trim(), kind, phone:(input.phone||"").trim(), aliases:(input.aliases||"").split(",").map(s=>s.trim()).filter(Boolean), createdAt:new Date().toISOString()};
  S.parties.push(p); saveState(); return p;
}
function updateParty(id, input){
  const p = party(id); if(!p) throw new Error(t("noResults"));
  const name = (input.name||"").trim(); if(!name) throw new Error(t("nameRequired"));
  p.name = name; p.area = (input.area||"").trim(); p.phone = (input.phone||"").trim(); p.aliases = (input.aliases||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(input.kind && (p.kind === "farmer" || p.kind === "broker") && (input.kind === "farmer" || input.kind === "broker")) p.kind = input.kind;
  saveState(); return p;
}
function setCommissionRate(paisa, unit, from){
  if(!(paisa > 0)) throw new Error(t("rateRequired"));
  if(!validDate(from)) throw new Error(t("pickDate"));
  S.settings.commission = (S.settings.commission || []).filter(c => c.from !== from);
  S.settings.commission.push({paisa, unit: unit === "kg" ? "kg" : "mun", from, setAt:todayISO() + " " + nowTime()});
  S.settings.commission.sort((a, b) => a.from < b.from ? -1 : 1);
  saveState();
}
function setOwner(o){ S.owner = {name:(o.name||"").trim(), biz:(o.biz||"").trim(), city:(o.city||"").trim(), area:(o.area||"").trim()}; saveState(); }
function setLangState(l){ LANG = l === "en" ? "en" : "ur"; if(S){ S.lang = LANG; saveState(); } }
function eraseAll(){ const owner = S.owner, lang = S.lang; S = emptyState(); S.owner = owner; S.lang = lang; saveState(); }

/* ---------- backup ---------- */
function backupJson(){ return JSON.stringify(Object.assign({app:"poultry-khata", exportedAt:new Date().toISOString()}, S), null, 1); }
function backupFileName(){ return `poultry-khata-backup-${todayISO()}.json`; }
function parseBackup(text){
  let o; try{ o = JSON.parse(text); }catch(e){ throw new Error(t("backupBad")); }
  if(!o || o.app !== "poultry-khata" || !Array.isArray(o.entries) || !Array.isArray(o.parties)) throw new Error(t("backupBad"));
  delete o.app; delete o.exportedAt;
  return normalizeState(o);
}
function restoreBackup(st){ S = st; LANG = S.lang === "en" ? "en" : "ur"; saveState(); }

/* ---------- sample data (clearly marked; one button erases it) ---------- */
function loadSampleData(){
  const owner = S.owner, lang = S.lang;
  S = emptyState(); S.owner = owner; S.lang = lang; S.sample = true;
  const today = todayISO(), yday = addDays(today, -1);
  const mk = (id, name, area, kind, aliases) => ({id, name, area, kind, phone:"", aliases:aliases||[], createdAt:new Date().toISOString()});
  const ur = LANG === "ur";
  S.parties.push(mk("f1", ur?"ندیم اختر (نمونہ)":"Nadeem Akhtar (sample)", ur?"قصور":"Kasur", "farmer", ["Nadim","ندیم"]));
  S.parties.push(mk("f2", ur?"اسلم رضا (نمونہ)":"Aslam Raza (sample)", ur?"شیخوپورہ":"Sheikhupura", "broker", ["Aslam"]));
  S.parties.push(mk("s1", ur?"بلال چکن (نمونہ)":"Bilal Chicken (sample)", ur?"ٹاؤن شپ":"Township", "shop", ["Bilal"]));
  S.parties.push(mk("s2", ur?"حمزہ پولٹری (نمونہ)":"Hamza Poultry (sample)", ur?"جوہر ٹاؤن":"Johar Town", "shop", ["Hamza"]));
  S.settings.commission = [{paisa:10000, unit:"mun", from:addDays(today, -30), setAt:yday + " 08:00"}];
  S.settings.bill = {address: ur ? "(نمونہ) منڈی روڈ، لاہور" : "(sample) Mandi Road, Lahore", contacts: ur ? "(نمونہ) آڑھتی  0300-0000000" : "(sample) Arati  0300-0000000", tagline: ""};
  const stamp = (date, time) => ({date, time});
  const add = (o, date, time) => { S.seq += 1; const e = mkEntry(Object.assign({seq:S.seq, date, time, ts:Date.now()}, o)); S.entries.push(e); return e; };
  const drv = ur ? "عمران (نمونہ)" : "Imran (sample)";
  S.drivers.push(drv);
  S.loads.push({id:"L001", farmerId:"f1", driver:drv, vehicle:"LEA-2046", vehicleOwner:drv, grams:400000, measured:true, date:yday, time:"08:00", ts:Date.now(), rate:{paisa:10000, unit:"mun"}, refRatePaisa:null, each:{grams:1818, unit:"nag", text:"22"}, note:""});
  S.invoices.push({id:"i1", ref:"L001-S1", loadId:"L001", partyId:"s1", farmerId:"f1", grams:250000, ratePaisa:1200000, rateUnit:"mun", gross:265000, tare:15000, short:0, date:yday});
  S.invoices.push({id:"i2", ref:"L001-S2", loadId:"L001", partyId:"s2", farmerId:"f1", grams:150000, ratePaisa:1240000, rateUnit:"mun", gross:158000, tare:8000, short:0, date:yday});
  add({kind:"sale", partyId:"s1", invoiceId:"i1", loadId:"L001", amountPaisa:7500000}, yday, "08:00");
  add({kind:"sale", partyId:"s2", invoiceId:"i2", loadId:"L001", amountPaisa:4650000}, yday, "08:01");
  add({kind:"receipt", partyId:"s1", invoiceId:"i1", loadId:"L001", amountPaisa:2500000, collector:"dealer", method:"cash"}, yday, "09:00");
  add({kind:"receipt", partyId:"s2", invoiceId:"i2", loadId:"L001", amountPaisa:650000, collector:"driver", method:"cash", driver:drv}, yday, "09:01");
  add({kind:"commission", partyId:"f1", loadId:"L001", amountPaisa:100000, terms:{paisa:10000, unit:"mun", grams:400000}}, yday, "08:02");
  add({kind:"remittance", partyId:"f1", amountPaisa:2000000, method:"cash"}, yday, "10:30");
  S.reminders.push({id:"r1", invoiceId:"i1", partyId:"s1", due:today, history:[]});
  S.reminders.push({id:"r2", invoiceId:"i2", partyId:"s2", due:yday, history:[]});
  S.supplierPromises.push({id:"sp1", partyId:"f1", due:addDays(today, 2), history:[]});
  saveState();
}
</script>

const BRAND_SVG = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A2 2 0 0 1 5 4.5h5v14H5a2 2 0 0 0-2 2z"/><path d="M12 6.5c2-2 4-2 5.5-.5 1 1 1 2 .5 3l2 1-2 .8c0 2-1.5 3.5-3.5 3.7V18"/><circle cx="15.3" cy="7.3" r=".6" fill="currentColor"/></svg>`;

/* ---------- navigation ---------- */
const NAV = {stack:[], cur:null};
const FS = {}; let F = {};
function go(screen, params, opts){
  params = params || {}; opts = opts || {};
  const def = SCREENS[screen]; if(!def) return;
  if(opts.replace) { /* keep stack */ } else if(NAV.cur && NAV.cur.screen !== screen) NAV.stack.push(NAV.cur);
  if(opts.root) NAV.stack.length = 0;
  NAV.cur = {screen, params};
  const g = def.group || screen;
  if(opts.reset) delete FS[g];
  F = FS[g] = FS[g] || {};
  closeSheet();
  render();
  const sc = document.getElementById("screen"); if(sc) sc.scrollTop = 0;
}
function back(){
  if(NAV.stack.length){ NAV.cur = NAV.stack.pop(); }
  else { NAV.cur = {screen: ONBOARDED() ? "home" : "language", params:{}}; }
  const def = SCREENS[NAV.cur.screen]; const g = def.group || NAV.cur.screen; F = FS[g] = FS[g] || {};
  closeSheet(); render(); const sc = document.getElementById("screen"); if(sc) sc.scrollTop = 0;
}
function toast(msg){ const el = document.getElementById("toast"); el.innerHTML = msg; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
function setLang(l){ setLangState(l); const f = document.getElementById("frame"); f.dir = LANG === "ur" ? "rtl" : "ltr"; f.lang = LANG; document.documentElement.lang = LANG; render(); }

/* ---------- chrome ---------- */
function renderHeader(){
  const def = SCREENS[NAV.cur.screen];
  const title = def.title ? def.title(NAV.cur.params) : "";
  const showBack = !def.root && NAV.cur.screen !== "language";
  const left = showBack
    ? `<button class="iconbtn" data-act="back" aria-label="${t("back")}"><span class="flip">${icon("back",26)}</span></button>`
    : `<div class="brand"><div class="brand-mark">${BRAND_SVG}</div><div><div class="brand-name">${t("appName")}</div><div class="brand-sub">${t("appSub")}</div></div></div>`;

  const langPill = `<button class="pill" data-act="toggleLang" aria-label="Language">${t("langSwitch")}</button>`;
  const gear = ONBOARDED() ? `<button class="iconbtn" data-act="go" data-arg="settings" aria-label="${t("settings")}">${icon("gear",24)}</button>` : "";
  const banner = (typeof SAVE_STATE !== "undefined" && SAVE_STATE === "fail") ? `<div class="banner" style="background:var(--red-bg);color:var(--red);border-color:var(--red-line)">${icon("alert",14)}<span class="grow">${t("saveFailed")}</span></div>` : (S && S.sample && ONBOARDED()) ? `<div class="banner">${icon("alert",14)}<span class="grow">${t("sampleBanner")}</span><button data-act="go" data-arg="settings">${t("eraseNow")}</button></div>` : "";
  return `<header class="hdr"><div class="hdr-row">${left}${titleHtml}${langPill}${gear}</div>${banner}</header>`;
}
function renderBar(){
  if(!ONBOARDED()) return "";
  const def = SCREENS[NAV.cur.screen]; if(def.noBar) return "";
  const cur = def.nav || "";
  const items = [["home","home",t("navHome")],["people","people",t("navKhatas")],["daybook","book",t("navToday")],["month","chart",t("navReports")]];
  return `<nav class="bar">${items.map(([id,ic,lab]) => `<button class="${cur===id?"on":""}" data-act="tab" data-arg="${id}" data-nav="${id}">${icon(ic,24)}<span>${lab}</span></button>`).join("")}</nav>`;
}
function render(){
  const def = SCREENS[NAV.cur.screen];
  document.getElementById("hdr").innerHTML = renderHeader();
  const sc = document.getElementById("screen");

function chips(name, options, value){
  return `<div class="chips" data-chips="${name}">${options.map(o => `<button class="chip ${value===o.v?"on":""} ${o.cls||""}" data-act="chip" data-chips="${name}" data-arg="${esc(o.v)}">${o.icon?icon(o.icon,18):""}${o.l}</button>`).join("")}</div>`;
}
function field(label, inner, opt){ opt = opt || {}; return `<div class="field"><div class="lbl"><span>${label}</span>${opt.right?`<span class="small">${opt.right}</span>`:""}</div>${inner}${opt.hint?`<div class="hint">${opt.hint}</div>`:""}${opt.err?`<div class="err-msg">${opt.err}</div>`:""}</div>`; }
const UR_ATTRS = ` data-ur="1" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"`;
function textInput(id, key, ph, opt){ opt = opt || {}; return `<input class="inp ${opt.num?"num":""} ${opt.err?"err":""}" id="${id}" data-model="${key}" type="${opt.type||"text"}" inputmode="${opt.inputmode||(opt.num?"decimal":"text")}" placeholder="${esc(ph||"")}" value="${esc((() => { const cur = getModel(key); return cur !== "" ? cur : (opt.value ?? ""); })())}"${opt.ur ? UR_ATTRS : ""} ${opt.attrs||""}>`; }
function numInput(id, key, ph, voiceType, opt){ opt = opt || {}; return `<div class="with-mic">${textInput(id, key, ph, Object.assign({num:true}, opt))}<button class="mic" data-act="voice" data-arg="${key}" data-vt="${voiceType}" data-field="${id}" aria-label="${t("voiceTitle")}">${icon("mic",24)}</button></div>`; }
function dateInput(id, key, value){ return `<input class="inp num" id="${id}" data-model="${key}" type="date" value="${esc(F[key] ?? value ?? "")}">`; }
function partyIcon(pp){ return pp.kind === "shop" ? "shop" : pp.kind === "broker" ? "handshake" : "leaf"; }
/* The person is fixed by the khata the form was opened from: no "who?" question on the form. */
function personHead(pp){ return `<div class="card" id="fixed-person" style="display:flex;align-items:center;gap:12px"><div class="ic" style="width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex:none">${icon(partyIcon(pp),22)}</div><div class="grow"><div class="small">${t("khataOf")}</div><div class="strong">${esc(partyName(pp))}</div><div class="small">${kindName(pp.kind)}${partyArea(pp)?" · "+esc(partyArea(pp)):""}</div></div></div>`; }
function autoStampLine(){ return `<div class="small row" style="gap:6px;align-items:center">${icon("calendar",16)}<span>${t("autoStamp")}:</span> ${fmtStamp(todayISO(), nowTime())}</div>`; }
function openKhataFirst(kind){ return `${note(t("openKhataFirst"),"amber")}<button class="btn primary" data-act="goParams" data-arg="people" data-params='{"tab":"${kind==="shop"?"shops":"suppliers"}"}'>${icon("people",22)} ${t("goToKhatas")}</button>`; }
function entryTitle(e){
  const map = {sale:"entrySale", receipt:"entryReceipt", remittance:"entryRemit", commission:"entryCommission", transfer:"entryTransfer", commission_pending:"entryCommissionPending", loss:"entryLoss", cancel:"entryCancel"};
  if(e.kind === "loss" && e.meta && e.meta.unsold) return t("unsoldOnVehicle");
  if(e.kind === "cancel") return `${t("entryCancel")} · #${String(e.meta.seq).padStart(3,"0")}`;
  return t(map[e.kind] || e.kind);
}
function entryIcon(e){ return {sale:"shop", receipt:"cash", remittance:"leaf", commission:"tag", transfer:"swap", commission_pending:"tag", loss:"scale", cancel:"cancel"}[e.kind] || "info"; }
function entryDetail(e){
  const bits = [];
  if(e.kind === "transfer") bits.push(esc(e.driver || ""));
  else if(e.partyId && e.partyId !== "__driver__") bits.push(esc(partyName(party(e.partyId))));
  if(e.invoiceId){ const inv = invoiceById(e.invoiceId); if(inv && e.kind === "sale") bits.push(`<span class="n">${fmtKg(inv.grams)} kg × ${invRateText(inv)}</span>`); if(inv) bits.push(`<span class="n">${esc(inv.ref)}</span>`); }
  else if(e.loadId && e.kind !== "cancel") bits.push(`<span class="n">${esc(e.loadId)}</span>`);
  if(e.kind === "commission" && e.terms) bits.push(`<span class="n">${munText(e.terms.grams)} mun · PKR ${fmtPaisa(e.terms.paisa)} ${e.terms.unit === "kg" ? "/kg" : "/mun"}</span>`);
  if(e.kind === "commission_pending") bits.push(`<span class="tag amber">${t("commissionNotSet")}</span>`);
  if(e.kind === "loss") bits.push(`<span class="n">${fmtKg(e.meta.grams)} kg</span> <span class="tag">${t("quantityOnly")}</span>`);
  if(e.kind === "receipt" && e.collector === "driver") bits.push(t("byDriver"));
  if((e.kind === "receipt" || e.kind === "remittance") && e.method === "bank") bits.push(t("bank"));
  if(e.kind === "cancel" && e.meta && e.meta.reason) bits.push(esc(e.meta.reason));
  if(e.note) bits.push(esc(e.note));
  if(e.status === "cancelled") bits.push(`<span class="tag red">${t("cancelledTag")}</span>`);
  return bits.join(" · ");
}
function entryRow(e, opt){
  opt = opt || {};
  const info = e.status === "info"; const cancelled = e.status === "cancelled";
  const amt = (e.kind === "loss" || e.kind === "commission_pending") ? "" : money(e.amountPaisa, "sm");
  const seqTag = `<span class="n">#${String(e.seq).padStart(3,"0")}</span>`;
  return `<button class="lrow ${info?"draft":""} ${cancelled?"cancelled":""}" data-act="entry" data-arg="${e.id}"><div class="ic">${icon(entryIcon(e),18)}</div><div class="mid"><div class="t1">${entryTitle(e)}</div><div class="t2">${entryDetail(e)}</div><div class="t2">${seqTag} · ${fmtStamp(e.date, e.time)}${opt.running!==undefined?` · ${t("remaining")}: ${moneyInline(opt.running)}`:""}</div></div><div class="end">${amt}</div></button>`;
}
function note(txt, cls){ return `<div class="note ${cls||""}">${icon(cls==="amber"?"alert":"info",18)}<span>${txt}</span></div>`; }
function balanceWords(pid){
  const p = party(pid); const b = partyBalance(pid);
  if(isSupplier(p)) return b.payable > 0 ? {cls:"neg", label:t("toPay"), amt:b.payable} : {cls:"", label:t("noBalance"), amt:0};
  if(b.receivable > 0) return {cls:"pos", label:t("toReceive"), amt:b.receivable};
  return {cls:"", label:t("noBalance"), amt:0};
}
function stTag(st){ return st === "overdue" ? `<span class="tag red">${icon("alert",12)} ${t("overdue")}</span>` : st === "today" ? `<span class="tag amber">${icon("clock",12)} ${t("dueToday")}</span>` : st === "upcoming" ? `<span class="tag green">${t("upcoming")}</span>` : st === "paid" ? `<span class="tag green">${t("settled")}</span>` : `<span class="tag">${t("noPromise")}</span>`; }

    const parts = line.split("|"); if(parts.length < 2) return;
    const keys = parts[0].trim().split(/\s+/); const vals = parts.slice(1).map(x => x.trim()).filter(Boolean);
    keys.forEach(k => { if(!TY_DICT[k]){ TY_DICT[k] = vals.slice(); TY_KEYS.push(k); } else vals.forEach(v => { if(!TY_DICT[k].includes(v)) TY_DICT[k].push(v); }); });
  });
  TY_KEYS.sort();
})();

/* ---- spelling rules (used for any word that is not in the dictionary) ---- */
const TY_LONG = new Set(["aa","ee","oo","ai","au","ay","ei","ey","ie","ou"]);
const TY_DIG = {kh:["خ","کھ"], gh:["غ","گھ"], sh:["ش"], ch:["چ","چھ"], th:["تھ","ٹھ","ث"], dh:["دھ","ڈھ"], bh:["بھ"], ph:["پھ","ف"], jh:["جھ"], zh:["ژ"]};
const TY_CON = {b:["ب"], p:["پ"], t:["ت","ٹ","ط"], j:["ج"], d:["د","ڈ"], r:["ر","ڑ"], z:["ز","ذ","ض","ظ"], f:["ف"], q:["ق","ک"], k:["ک","ق"], g:["گ","غ"], l:["ل"], m:["م"], n:["ن"], s:["س","ص","ث"], h:["ہ","ح"], v:["و"], w:["و"], y:["ی"], c:["ک","س"], x:["کس"]};
function tyTokens(w){
  const tk = []; let i = 0;
  while(i < w.length){
    const c2 = w.slice(i, i + 2), c1 = w[i];
    if(TY_DIG[c2]){ tk.push({k:"C", s:c2}); i += 2; continue; }
    if(TY_LONG.has(c2)){ tk.push({k:"V", s:c2}); i += 2; continue; }
    if("aeiou".includes(c1)){ tk.push({k:"V", s:c1}); i++; continue; }
    const prev = tk[tk.length - 1];
    if(!(prev && prev.k === "C" && prev.s === c1)) tk.push({k:"C", s:c1}); // a doubled letter is written once
    i++;
  }
  return tk;
}
function tyAfter(tk, i){ let j = i + 1, c = 0; while(j < tk.length && tk[j].k === "C"){ c++; j++; } return {cons:c, nextV:tk[j] || null, end:j >= tk.length}; }
function tyVowel(tk, i){
  const s = tk[i].s, first = i === 0, last = i === tk.length - 1, prev = tk[i-1], next = tk[i+1];
  const prevV = !!(prev && prev.k === "V"), nextV = !!(next && next.k === "V");
  const af = tyAfter(tk, i);
  switch(s){
    case "aa": return first ? ["آ"] : ["ا"];
    case "ee": return first ? ["ای"] : ["ی"];
    case "oo": return first ? ["او"] : ["و"];
    case "ai": case "ay": return first ? ["ای"] : last ? ["ے","ی"] : ["ی","ے"];
    case "ei": case "ey": return last ? ["ے","ی"] : ["ی","ے"];
    case "ie": return ["ی"];
    case "au": case "ou": return first ? ["او"] : ["و"];
    case "a":
      if(first) return ["ا","ع"];
      if(prevV) return ["ا","ع"];
      if(last) return ["ا","ہ"];
      if(nextV) return ["ع","ا"];
      if(af.cons >= 2) return ["","ا"];
      if(af.end) return ["ا",""];
      if(af.nextV && (TY_LONG.has(af.nextV.s) || af.nextV.s === "a")) return ["","ا"];
      return ["ا",""];
    case "e":
      if(first) return ["ا","ع"];
      if(last) return ["ے","ی"];
      if(next && next.k === "C" && next.s === "h") return ["","ی"];
      return ["ی",""];
    case "i":
      if(first) return ["ا","ع"];
      if(last) return ["ی","ے"];
      if(prevV || nextV) return ["ی",""];
      return ["","ی"];
    case "o":
      if(first) return ["او","ع"];
      return ["و",""];
    case "u":
      if(first) return ["ا","ع"];
      if(last) return ["و",""];
      if(prevV || nextV) return ["و",""];
      return ["","و"];
  }
  return [s];
}
function tySlots(w){
  const tk = tyTokens(w); const slots = [];
  for(let i = 0; i < tk.length; i++){
    const T = tk[i];
    if(T.k === "C"){
      let o = TY_DIG[T.s] || TY_CON[T.s] || [T.s];
      if(T.s === "n" && i === tk.length - 1 && i > 0 && tk[i-1].k === "V") o = ["ن","ں"];
      if(T.s === "c"){ const nx = tk[i+1]; if(nx && nx.k === "V" && "eiy".includes(nx.s[0])) o = ["س","ک"]; }
      slots.push({o, l:T.s, c:true});
    } else slots.push({o:tyVowel(tk, i), l:T.s, v:true});
  }
  return slots;
}
function tyPri(s){ return s.v ? 2 : ({h:1, s:3, t:3, z:3, k:4, g:5, d:5, r:5, c:5, q:5, n:6}[s.l] || 7); }
function tyUnique(arr){ const seen = new Set(); return arr.filter(x => x && !seen.has(x) && seen.add(x)); }
function tyRule(w){
  const slots = tySlots(w);
  const base = slots.map(s => s.o[0]).join("");
  const variants = [];
  const optional = slots.filter(s => s.v && s.o.length > 1);
  if(optional.some(s => s.o[0] === "")) variants.push(slots.map(s => (s.v && s.o[0] === "" && s.o.length > 1) ? s.o[1] : s.o[0]).join(""));
  if(optional.some(s => s.o[0] !== "" && s.o.includes(""))) variants.push(slots.map(s => (s.v && s.o[0] !== "" && s.o.includes("")) ? "" : s.o[0]).join(""));
  const swaps = [];
  slots.forEach((s, idx) => { if(s.o.length > 1 && (s.c || (s.v && (idx === 0 || idx === slots.length - 1)))) for(let k = 1; k < s.o.length; k++) if(s.o[k] !== "") swaps.push({idx, v:s.o[k], pri:tyPri(s)}); });
  swaps.sort((a, b) => a.pri - b.pri || a.idx - b.idx);
  swaps.forEach(sw => variants.push(slots.map((s, idx) => idx === sw.idx ? sw.v : s.o[0]).join("")));
  return {main:base, variants:tyUnique(variants).filter(v => v !== base).slice(0, 7)};
}

/* ---- candidates for one English word ---- */
function tyNorm(raw){ return String(raw || "").toLowerCase().replace(/[^a-z]/g, ""); }
function tyLearned(raw){ const L = S && S.typing && S.typing.learned; return L && Object.prototype.hasOwnProperty.call(L, raw) ? L[raw] : null; }
function tyCandidates(rawIn){
  const raw = tyNorm(rawIn); if(!raw) return [];
  const out = [];
  const lv = tyLearned(raw); if(lv) out.push(lv);
  if(TY_DICT[raw]) out.push(...TY_DICT[raw]);
  const r = tyRule(raw); out.push(r.main, ...r.variants);
  return tyUnique(out);
}
function tyCompletions(rawIn, max){
  const raw = tyNorm(rawIn); if(raw.length < 2) return [];
  const hits = TY_KEYS.filter(k => k.length > raw.length && k.startsWith(raw)).sort((a, b) => a.length - b.length || (a < b ? -1 : 1));
  const out = []; for(const k of hits){ const v = TY_DICT[k][0]; if(!out.includes(v)) out.push(v); if(out.length >= (max || 3)) break; }
  return out;
}
function tyPrimary(raw){ const c = tyCandidates(raw); return c.length ? c[0] : String(raw || ""); }
function tySearchForms(raw){ return tyUnique(tyCandidates(raw).concat(tyCompletions(raw, 6))); }
function tyLearn(raw, chosen){ if(!S || !raw) return; S.typing = S.typing || {learned:{}}; const L = S.typing.learned = S.typing.learned || {}; delete L[raw]; L[raw] = chosen; const keys = Object.keys(L); if(keys.length > 600) keys.slice(0, keys.length - 600).forEach(k => delete L[k]); saveState(); }

/* ---- live typing in a field ---- */
const TYS = new WeakMap();
function tyOn(el){ return !!(el && el.dataset && el.dataset.ur === "1" && LANG === "ur"); }
function tySt(el){ let s = TYS.get(el); if(!s){ s = {raw:"", start:0, len:0, shown:"", last:el.value}; TYS.set(el, s); } return s; }
function tyLetters(s){ return /^[A-Za-z]+$/.test(s); }
function tyCaret(el, pos){ try{ el.setSelectionRange(pos, pos); }catch(e){} }
function tyApply(el, st, before, raw, after){
  const urdu = raw ? tyPrimary(raw) : "";
  el.value = before + urdu + after;
  tyCaret(el, before.length + urdu.length);
  st.start = before.length; st.len = urdu.length; st.shown = urdu; st.last = el.value;
  tyBar(el, st);
}
function tyForget(st){ st.raw = ""; st.shown = ""; st.len = 0; }
function tyOnInput(ev){
  const el = ev.target; if(!tyOn(el)) return;
  const st = tySt(el);
  const prev = st.last, cur = el.value;
  if(prev === cur) return;
  let a = 0; const ma = Math.min(prev.length, cur.length);
  while(a < ma && prev.charCodeAt(a) === cur.charCodeAt(a)) a++;
  let b = 0; const mb = ma - a;
  while(b < mb && prev.charCodeAt(prev.length - 1 - b) === cur.charCodeAt(cur.length - 1 - b)) b++;
  const removed = prev.slice(a, prev.length - b), added = cur.slice(a, cur.length - b);
  const before = prev.slice(0, a), after = prev.slice(prev.length - b);
  const ws = st.start, we = st.start + st.len;
  const active = st.raw !== "" && we <= prev.length && prev.slice(ws, we) === st.shown;
  if(!active) tyForget(st);
  // a) something was deleted
  if(added === ""){
    if(active && removed.length === 1 && a + 1 === we){ st.raw = st.raw.slice(0, -1); tyApply(el, st, prev.slice(0, ws), st.raw, prev.slice(we)); return; }
    tyForget(st); st.last = cur; tyBar(el, st); return;
  }
  // b) the keyboard replaced our word with the whole English word
  if(active && a === ws && a + removed.length === we && tyLetters(added)){ st.raw = added.toLowerCase(); tyApply(el, st, prev.slice(0, ws), st.raw, prev.slice(we)); return; }
  // c) English letters typed
  if(tyLetters(added)){
    if(active && removed === "" && a === we){
      // a keyboard that does not know we changed its word may send the whole English word again, after our Urdu word
      const low = added.toLowerCase();
      st.raw = (low.length > st.raw.length && low.startsWith(st.raw)) ? low : st.raw + low;
      tyApply(el, st, prev.slice(0, ws), st.raw, prev.slice(we)); return;
    }
    if(/[A-Za-z]$/.test(before)){ tyForget(st); st.last = cur; tyBar(el, st); return; } // continuing a word that was kept in English
    tyForget(st); st.raw = added.toLowerCase(); tyApply(el, st, before, st.raw, after); return;
  }
  // d) space, digit, punctuation, Urdu typed directly, or pasted text
  tyForget(st);
  if(/[A-Za-z]/.test(added) && added.length > 1){ const conv = added.replace(/[A-Za-z]+/g, m => tyPrimary(m)); el.value = before + conv + after; tyCaret(el, before.length + conv.length); st.last = el.value; tyBar(el, st); return; }
  st.last = cur; tyBar(el, st);
}
function tyEnd(el){ const st = tySt(el); tyForget(st); st.last = el.value; tyBar(el, st); }

/* ---- the little strip of other spellings, right under the field ---- */
function tyBar(el, st){
  const old = el._tyBar;
  const focused = document.activeElement === el;
  if(!tyOn(el) || !focused){ if(old){ old.remove(); el._tyBar = null; } return; }
  let html = "";
  if(st.raw !== ""){
    const cands = tyCandidates(st.raw); const comps = tyCompletions(st.raw, 3).filter(c => !cands.includes(c));
    const list = tyUnique(cands.slice(0, 6).concat(comps)).slice(0, 8);
    html = list.map((c, i) => `<button type="button" class="tyc ${i === 0 ? "main" : ""}" tabindex="-1" data-v="${esc(c)}">${esc(c)}</button>`).join("") + `<button type="button" class="tyc lat" tabindex="-1" data-v="${esc(st.raw)}">${esc(st.raw)}</button>`;
  } else if(el.value === ""){
    html = `<span class="tytip">${t("tyTip")}</span>`;
  }
  if(!html){ if(old){ old.remove(); el._tyBar = null; } return; }
  let bar = old;
  const parent = el.parentElement; if(!parent) return;
  if(!bar){
    bar = document.createElement("div"); bar.className = "tybar"; el._tyBar = bar;
    if(getComputedStyle(parent).position === "static") parent.style.position = "relative";
    parent.appendChild(bar);
    bar.addEventListener("mousedown", (e) => e.preventDefault());
    bar.addEventListener("pointerdown", (e) => { if(e.target.closest(".tyc")) e.preventDefault(); });
    bar.addEventListener("click", (e) => { const b = e.target.closest(".tyc"); if(b){ e.preventDefault(); tyPick(el, b.dataset.v); } });
  }
  if(bar.innerHTML !== html) bar.innerHTML = html;
  // the strip sits just ABOVE the field (so it never covers the button under it); below only when the field is right at the top of the screen
  const pr = parent.getBoundingClientRect(), er = el.getBoundingClientRect();
  const sc = document.getElementById("screen"); const topEdge = sc ? sc.getBoundingClientRect().top : 0;
  const barH = bar.offsetHeight || 64;
  const above = er.top - topEdge >= barH + 8;
  bar.style.top = (above ? er.top - pr.top - barH - 6 : er.bottom - pr.top + 4) + "px";
  bar.dataset.empty = st.raw === "" ? "1" : "";
  bar.dataset.pos = above ? "above" : "below";
  if(!bar._seen){ bar._seen = true; try{ const vv = window.visualViewport; const bottom = vv ? vv.offsetTop + vv.height : innerHeight; const r = bar.getBoundingClientRect(); if(r.bottom > bottom - 6 || r.top < topEdge) bar.scrollIntoView({block:"nearest"}); }catch(e){} }
}
function tyPick(el, value){
  const st = tySt(el); if(st.raw === "") return;
  const raw = st.raw, v = el.value;
  const before = v.slice(0, st.start), after = v.slice(st.start + st.len);
  const text = value + (after === "" ? " " : "");
  el.value = before + text + after; tyCaret(el, before.length + text.length);
  tyLearn(raw, value);
  tyForget(st); st.last = el.value; tyBar(el, st);
  try{ onModelInput({target:el, type:"input"}); }catch(e){}
  try{ el.focus(); }catch(e){}
}
document.addEventListener("input", tyOnInput, true);
document.addEventListener("focusin", (e) => { const el = e.target; if(tyOn(el)){ const st = tySt(el); st.last = el.value; tyForget(st); tyBar(el, st); } });
document.addEventListener("focusout", (e) => { const el = e.target; if(el && el._tyBar){ tyForget(tySt(el)); el._tyBar.remove(); el._tyBar = null; } });
</script>

/* ---------- people list (one section) ---------- */
function peopleRows(tab, q){

}
